name: SpiralCore authenticated FlowMux component
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/spiralcore-mvm-flowmux/**'
      - 'crates/spiralcore-transfer/**'
      - 'crates/spiralcore-storage-windows/**'
      - 'crates/uor-r4-object-store/**'
      - 'docs/platforms/mvm-mailbox-portable.json'
      - '.github/workflows/spiralcore-flowmux.yml'
permissions:
  contents: read
concurrency:
  group: spiralcore-flowmux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.rows.outputs.include }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: rows
        shell: pwsh
        run: |
          $manifest = Get-Content docs/platforms/mvm-mailbox-portable.json -Raw | ConvertFrom-Json
          "include=$(@{ include = @($manifest.rows) } | ConvertTo-Json -Depth 8 -Compress)" >> $env:GITHUB_OUTPUT
  native-stream:
    needs: matrix
    name: TLS/object stream / ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.matrix.outputs.include) }}
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      NATIVE_TARGET: ${{ matrix.target }}
      EXPECTED_OS: ${{ matrix.os }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record native source and runner
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory flowmux-evidence | Out-Null
          if ($env:RUNNER_OS -ne $env:EXPECTED_OS -or $env:RUNNER_ARCH -ne $env:EXPECTED_ARCH) { throw 'Native runner mismatch' }
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Source identity failed' }
          @{ source = $source; run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT;
            os = $env:RUNNER_OS; arch = $env:RUNNER_ARCH; image = $env:ImageVersion;
            description = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription;
            scope = 'native process; paired TCP/TLS/shared-object component; no MVM backend or WAN';
            lock_sha256 = (Get-FileHash crates/spiralcore-mvm-flowmux/Cargo.lock -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content flowmux-evidence/identity.json
      - name: Install pinned native toolchain
        run: |
          rustup toolchain install "1.97.1-$env:NATIVE_TARGET" --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain install failed' }
          rustc "+1.97.1-$env:NATIVE_TARGET" -vV | Tee-Object flowmux-evidence/rustc.txt
          if ($LASTEXITCODE -ne 0 -or !(Select-String -Path flowmux-evidence/rustc.txt -SimpleMatch -Pattern "host: $env:NATIVE_TARGET")) { throw 'Toolchain is not native' }
      - name: Execute native decoder and reply-progress controls
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $cargoArgs = @("+1.97.1-$env:NATIVE_TARGET", 'test', '--release', '--locked', '--manifest-path',
            'crates/spiralcore-mvm-flowmux/Cargo.toml', '--lib')
          $log = (& cargo @cargoArgs -- --show-output --test-threads=1 --color never 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $log | Set-Content flowmux-evidence/reply-progress-controls.txt
          $log | Write-Output
          if ($code -ne 0 -or $log -notmatch 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;') { throw 'Native reply-progress controls failed' }
      - name: Execute checked metadata guards and native paired comparison
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $cargoArgs = @("+1.97.1-$env:NATIVE_TARGET", 'test', '--release', '--locked', '--manifest-path',
            'crates/spiralcore-transfer/Cargo.toml', '--lib', 'endpoint::metadata_tests')
          $expected = if ($env:RUNNER_OS -eq 'Windows') { 4 } else { 3 }
          $listing = (& cargo @cargoArgs -- --list --format terse 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $listing | Set-Content flowmux-evidence/metadata-list.txt
          $listed = [regex]::Matches($listing, '(?m)^.+: test\r?$').Count
          if ($code -ne 0 -or $listed -ne $expected) { throw "Expected $expected metadata guards, listed $listed" }
          $log = (& cargo @cargoArgs -- --show-output --test-threads=1 --color never 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $log | Set-Content flowmux-evidence/metadata-tests.txt
          $log | Write-Output
          $summaries = [regex]::Matches($log, 'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;')
          if ($code -ne 0 -or $summaries.Count -ne 1) { throw 'Metadata guards failed' }
          $g = $summaries[0].Groups
          if ([int]$g[1].Value -ne $expected -or [int]$g[2].Value -ne 0 -or [int]$g[3].Value -ne 0 -or [int]$g[4].Value -ne 0) { throw 'Incomplete metadata guards' }
          @{ listed = $listed; passed = [int]$g[1].Value; failed = 0; ignored = 0;
            filtered_other_library_tests = [int]$g[5].Value;
            scope = 'selected metadata equivalence guards; Windows includes six paired native trials'
          } | ConvertTo-Json | Set-Content flowmux-evidence/metadata-counts.json
          if ($env:RUNNER_OS -eq 'Windows') {
            $pairs = [regex]::Matches($log, '(?m)^METADATA_OPEN_PAIR (.+)\r?$')
            if ($pairs.Count -ne 6 -or [regex]::Matches($log, '(?m)^METADATA_OPEN_SETUP ').Count -ne 1 -or [regex]::Matches($log, '(?m)^METADATA_OPEN_GUARDS ').Count -ne 1) { throw 'Missing native metadata measurements or refusal guards' }
            $rows = @($pairs | ForEach-Object { $_.Groups[1].Value | ConvertFrom-Json })
            foreach ($row in $rows) {
              if ($row.exact_readbacks -ne $true -or $row.files -ne 64) { throw 'Incomplete native paired metadata readback' }
            }
            $rows | ConvertTo-Json -Depth 6 | Set-Content flowmux-evidence/metadata-pairs.json
          }
          if (git status --porcelain -- crates/spiralcore-transfer/Cargo.lock) { throw 'Locked metadata execution changed source' }
      - name: Execute native existing-file descriptor comparison
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $cargoArgs = @("+1.97.1-$env:NATIVE_TARGET", 'test', '--release', '--locked', '--manifest-path',
            'crates/spiralcore-storage-windows/Cargo.toml', '--lib',
            'tests::existing_open_descriptor_elision_preserves_guards_and_records_paired_cost')
          $listing = (& cargo @cargoArgs -- --list --format terse 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $listing | Set-Content flowmux-evidence/existing-open-list.txt
          $listed = [regex]::Matches($listing, '(?m)^.+: test\r?$').Count
          if ($code -ne 0 -or $listed -ne 1) { throw "Expected one native existing-open comparison, listed $listed" }
          $log = (& cargo @cargoArgs -- --exact --show-output --test-threads=1 --color never 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $log | Set-Content flowmux-evidence/existing-open-tests.txt
          $log | Write-Output
          $summaries = [regex]::Matches($log, 'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;')
          if ($code -ne 0 -or $summaries.Count -ne 1) { throw 'Native existing-open comparison failed' }
          $g = $summaries[0].Groups
          if ([int]$g[1].Value -ne 1 -or [int]$g[2].Value -ne 0 -or [int]$g[3].Value -ne 0 -or [int]$g[4].Value -ne 0) { throw 'Incomplete existing-open comparison' }
          $pairs = [regex]::Matches($log, '(?m)^EXISTING_OPEN_PAIR (.+)\r?$')
          $setup = [regex]::Matches($log, '(?m)^EXISTING_OPEN_SETUP (.+)\r?$')
          $guards = [regex]::Matches($log, '(?m)^EXISTING_OPEN_GUARDS (.+)\r?$')
          if ($pairs.Count -ne 6 -or $setup.Count -ne 1 -or $guards.Count -ne 1) { throw 'Missing existing-open paired measurements or guards' }
          $rows = @($pairs | ForEach-Object { $_.Groups[1].Value | ConvertFrom-Json })
          for ($i = 0; $i -lt 6; $i++) {
            $row = $rows[$i]
            $order = if ($i % 2 -eq 0) { 'old-new' } else { 'new-old' }
            if ($row.trial -ne $i -or $row.order -ne $order -or $row.exact_readbacks -ne $true -or $row.files -ne 64 -or $row.bytes -ne 1048576) { throw 'Incomplete alternating existing-open readback' }
          }
          $guardRow = $guards[0].Groups[1].Value | ConvertFrom-Json
          foreach ($name in @('exact_readbacks','noninherit','owner_dacl_unchanged','missing','directory','hardlink','conflicting_writer','broad_acl_no_repair','reparse_ancestor')) {
            if ($guardRow.$name -ne $true) { throw "Missing existing-open guard: $name" }
          }
          @{ listed = $listed; passed = 1; failed = 0; ignored = 0;
            filtered_other_storage_tests = [int]$g[5].Value; setup = ($setup[0].Groups[1].Value | ConvertFrom-Json);
            pairs = $rows; guards = $guardRow; scope = 'native checked-open and full-read comparison; not network or MVM'
          } | ConvertTo-Json -Depth 6 | Set-Content flowmux-evidence/existing-open-results.json
          & cargo "+1.97.1-$env:NATIVE_TARGET" clippy --release --locked --manifest-path crates/spiralcore-storage-windows/Cargo.toml --all-targets -- -D warnings 2>&1 | Tee-Object flowmux-evidence/existing-open-clippy.txt
          if ($LASTEXITCODE -ne 0) { throw 'Strict Windows storage Clippy failed' }
          if (git status --porcelain -- crates/spiralcore-storage-windows/Cargo.lock) { throw 'Locked existing-open execution changed source' }
      - name: Check single-victim verification and failed multi-victim preflight
        run: |
          $test = 'endpoint::ordered_eviction_tests::single_and_multiple_victim_validation_precedes_removal'
          $log = (& cargo "+1.97.1-$env:NATIVE_TARGET" test --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --lib $test -- --exact --show-output --color never 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $log | Set-Content flowmux-evidence/single-eviction.txt
          if ($code -ne 0 -or $log -notmatch 'ORDERED_SINGLE_EVICTION bytes=16384 full_reads=1' -or $log -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') { throw 'Original single-victim read, expected charge and preflight controls failed' }
      - name: Measure verified cold commit costs on Server 2025
        if: matrix.id == 'windows2025-x64'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $selector = 'endpoint::commit_costs::cold_whole_ordered_commit_after_full_cache'
          $log = (& cargo "+1.97.1-$env:NATIVE_TARGET" test --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --lib $selector -- --exact --ignored --nocapture 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $log | Set-Content flowmux-evidence/commit-costs.txt
          $log | Write-Output
          if ($code -ne 0 -or $log -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;' -or [regex]::Matches($log, '(?m)^ORDERED_COMMIT_EXACT ').Count -ne 3) {
            throw 'Cold commit timings missing or exact readback failed'
          }
      - name: Strict metadata and transfer warnings
        run: |
          & cargo "+1.97.1-$env:NATIVE_TARGET" clippy --release --locked --keep-going --manifest-path crates/spiralcore-transfer/Cargo.toml --all-targets -- -D warnings 2>&1 | Tee-Object flowmux-evidence/metadata-clippy.txt
          if ($LASTEXITCODE -ne 0) { throw 'Strict transfer Clippy failed' }
      - name: Execute nonzero paired TLS and exact-object tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $cargoArgs = @("+1.97.1-$env:NATIVE_TARGET", 'test', '--release', '--locked', '--manifest-path',
            'crates/spiralcore-mvm-flowmux/Cargo.toml', '--all-targets')
          $listing = (& cargo @cargoArgs -- --list --format terse 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $listing | Set-Content flowmux-evidence/test-list.txt
          if ($code -ne 0) { throw 'Test listing failed' }
          $listed = [regex]::Matches($listing, '(?m)^.+: test\r?$').Count
          if ($listed -lt 34) { throw "Missing component coverage: $listed" }
          $log = (& cargo @cargoArgs -- --format pretty --color never --show-output 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $log | Set-Content flowmux-evidence/tests.txt
          $log | Write-Output
          $summaries = [regex]::Matches($log, 'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;')
          if ($code -ne 0 -or $summaries.Count -eq 0) { throw 'Native component tests failed' }
          $passed = 0
          foreach ($summary in $summaries) {
            $g = $summary.Groups
            if ([int]$g[2].Value -ne 0 -or [int]$g[3].Value -ne 0 -or [int]$g[4].Value -ne 0 -or [int]$g[5].Value -ne 0) { throw 'Failed, ignored or filtered native scope' }
            $passed += [int]$g[1].Value
          }
          if ($passed -ne $listed) { throw 'Listed tests do not equal passed tests' }
          @{ listed = $listed; passed = $passed; failed = 0; ignored = 0; scope = 'component only' } | ConvertTo-Json | Set-Content flowmux-evidence/counts.json
          if (git status --porcelain -- crates/spiralcore-mvm-flowmux/Cargo.lock) { throw 'Locked execution changed source' }
      - name: Execute ordered cache, Small resource and schema reuse regressions
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $cargoArgs = @("+1.97.1-$env:NATIVE_TARGET", 'test', '--release', '--locked', '--manifest-path',
            'crates/spiralcore-transfer/Cargo.toml', '--test', 'ordered_retention', '--test', 'small_resources', '--test', 'schema_reuse')
          $listing = (& cargo @cargoArgs -- --list --format terse 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $listing | Set-Content flowmux-evidence/ordered-list.txt
          $listed = [regex]::Matches($listing, '(?m)^.+: test\r?$').Count
          if ($code -ne 0 -or $listed -ne 20) { throw "Expected 20 ordered/Small/schema regressions, listed $listed" }
          $log = (& cargo @cargoArgs -- --format pretty --color never 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $log | Set-Content flowmux-evidence/ordered-tests.txt
          $log | Write-Output
          $summaries = [regex]::Matches($log, 'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;')
          if ($code -ne 0 -or $summaries.Count -ne 3) { throw 'Ordered/Small/schema regressions failed' }
          $passed = 0
          foreach ($summary in $summaries) {
            $g = $summary.Groups
            if ([int]$g[2].Value -ne 0 -or [int]$g[3].Value -ne 0 -or [int]$g[4].Value -ne 0 -or [int]$g[5].Value -ne 0) { throw 'Incomplete ordered/Small coverage' }
            $passed += [int]$g[1].Value
          }
          if ($passed -ne $listed) { throw 'Ordered listed/passed mismatch' }
          @{ listed = $listed; passed = $passed; failed = 0; ignored = 0; scope = 'ordered cache, Small resources and schema reuse; component only' } | ConvertTo-Json | Set-Content flowmux-evidence/ordered-counts.json
      - name: Strict component warnings
        run: |
          & cargo "+1.97.1-$env:NATIVE_TARGET" clippy --release --locked --manifest-path crates/spiralcore-mvm-flowmux/Cargo.toml --all-targets -- -D warnings 2>&1 | Tee-Object flowmux-evidence/clippy.txt
          if ($LASTEXITCODE -ne 0) { throw 'Strict Clippy failed' }
      - name: Checksum retained evidence
        if: always()
        run: |
          if (Test-Path flowmux-evidence) {
            Get-ChildItem flowmux-evidence -File | Sort-Object Name | ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
            } | Set-Content flowmux-evidence/SHA256SUMS
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flowmux-component-${{ matrix.id }}-${{ github.run_attempt }}
          path: flowmux-evidence/
          if-no-files-found: error
          retention-days: 14
