name: SpiralCore unrelated-object CPU WAN pilot
on:
  push:
    branches: [codex/spiralcore-unrelated-cpu]
permissions:
  contents: read
concurrency:
  group: spiralcore-unrelated-cpu
  cancel-in-progress: false
jobs:
  measure:
    if: github.ref == 'refs/heads/codex/spiralcore-unrelated-cpu' && github.sha == vars.SPIRALCORE_UNRELATED_SOURCE && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: 0
      SPIRALCORE_UNRELATED_SOURCE: ${{ vars.SPIRALCORE_UNRELATED_SOURCE }}
      SPIRALCORE_UNRELATED_RUN: ${{ vars.SPIRALCORE_UNRELATED_RUN }}
      SPIRALCORE_UNRELATED_RECEIVER_SHA256: ${{ vars.SPIRALCORE_UNRELATED_RECEIVER_SHA256 }}
      UNRELATED_RECEIVER_SHA: ${{ vars.SPIRALCORE_UNRELATED_RECEIVER_SHA256 }}
      UNRELATED_URL_0: ${{ vars.SPIRALCORE_UNRELATED_URL_0 }}
      UNRELATED_URL_1: ${{ vars.SPIRALCORE_UNRELATED_URL_1 }}
      UNRELATED_URL_2: ${{ vars.SPIRALCORE_UNRELATED_URL_2 }}
      UNRELATED_URL_3: ${{ vars.SPIRALCORE_UNRELATED_URL_3 }}
      UNRELATED_URL_4: ${{ vars.SPIRALCORE_UNRELATED_URL_4 }}
      UNRELATED_URL_5: ${{ vars.SPIRALCORE_UNRELATED_URL_5 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate registered source and bounded receiver configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir unrelated-cpu
          # BEGIN CONFIG GATE
          [[ "$GITHUB_REF" == refs/heads/codex/spiralcore-unrelated-cpu ]] || exit 1
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || exit 1
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$SPIRALCORE_UNRELATED_SOURCE" ]] || exit 1
          [[ "$SPIRALCORE_UNRELATED_RUN" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$UNRELATED_RECEIVER_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          for key in UNRELATED_URL_0 UNRELATED_URL_1 UNRELATED_URL_2 UNRELATED_URL_3 UNRELATED_URL_4 UNRELATED_URL_5; do
            url="${!key}"
            [[ "$url" =~ ^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.trycloudflare\.com/?$ ]] || exit 1
          done
          # END CONFIG GATE
          # BEGIN DOSE GATE
          UNRELATED_SHARDS='0 1 2 3 4 5'
          UNRELATED_TRIALS_PER_SIZE=6
          UNRELATED_MAX_TRANSFERS_PER_SHARD=70
          UNRELATED_MAX_TRANSFERS=420
          UNRELATED_MAX_STORE_BYTES=805306368
          # END DOSE GATE
          printf 'UNRELATED_SHARDS=%s\nUNRELATED_MAX_TRANSFERS_PER_SHARD=%s\nUNRELATED_MAX_STORE_BYTES=%s\n' \
            "$UNRELATED_SHARDS" "$UNRELATED_MAX_TRANSFERS_PER_SHARD" "$UNRELATED_MAX_STORE_BYTES" >> "$GITHUB_ENV"
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ ! -e "$CARGO_TARGET_DIR" ]] || exit 1
          [[ -z "${RUSTFLAGS:-}${CARGO_ENCODED_RUSTFLAGS:-}${RUSTC_WRAPPER:-}${RUSTC_WORKSPACE_WRAPPER:-}${CARGO_BUILD_TARGET:-}" ]] || exit 1
          git diff --exit-code > unrelated-cpu/source-clean-before.log
          git rev-parse HEAD > unrelated-cpu/source-revision.txt
          jq -n --arg source "$GITHUB_SHA" --arg run "$SPIRALCORE_UNRELATED_RUN" \
            --arg receiver "$UNRELATED_RECEIVER_SHA" --arg workflow_run "$GITHUB_RUN_ID" \
            --argjson trials "$UNRELATED_TRIALS_PER_SIZE" --argjson operations "$UNRELATED_MAX_TRANSFERS" \
            --argjson per_shard "$UNRELATED_MAX_TRANSFERS_PER_SHARD" --argjson store_bytes "$UNRELATED_MAX_STORE_BYTES" \
            --arg url0 "$UNRELATED_URL_0" --arg url1 "$UNRELATED_URL_1" --arg url2 "$UNRELATED_URL_2" \
            --arg url3 "$UNRELATED_URL_3" --arg url4 "$UNRELATED_URL_4" --arg url5 "$UNRELATED_URL_5" \
            '{schema:"spiralcore.unrelated-cpu.workflow.v1",source:$source,run:$run,
              receiver_executable_sha256_operator_supplied:$receiver,
              urls:[$url0,$url1,$url2,$url3,$url4,$url5],github_run_id:$workflow_run,github_run_attempt:1,
              shards:6,trials_per_size:$trials,sizes:[1048576,16777216],sessions:36,targets:360,base_seeds:36,
              max_artifact_seeds:24,max_total_transfers:$operations,max_transfers_per_shard:$per_shard,
              max_store_bytes:$store_bytes,updates_per_session:10,
              designation:"one six-pair WAN pilot after local gates; not thirty-pair acceptance",
              byte_scope:"request and response HTTP bodies; not full-path packet bytes"}' \
            > unrelated-cpu/registration.json
      - name: Install compiler and record the Linux sender
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy 2>&1 | tee unrelated-cpu/toolchain-install.log
          rustc +1.97.1 -vV > unrelated-cpu/rustc.txt
          [[ "$(sed -n 's/^host: //p' unrelated-cpu/rustc.txt)" == x86_64-unknown-linux-gnu ]] || exit 1
          uname -a > unrelated-cpu/platform.txt
          lscpu -J > unrelated-cpu/cpu.json
          cargo +1.97.1 tree --locked --manifest-path crates/spiralcore-transfer/Cargo.toml -e features > unrelated-cpu/features.txt
          git ls-files -z -- crates/spiralcore-transfer crates/uor-r4-object-store/src \
            .github/workflows/spiralcore-unrelated-cpu.yml \
            | sort -z | xargs -0 sha256sum > unrelated-cpu/source-files.sha256
      - name: Qualify and freeze the matched persistent senders
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          SPIRALCORE_EXPECT_ZSTD_PROBE=enabled cargo +1.97.1 test --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --all-targets 2>&1 | tee unrelated-cpu/candidate-tests.log
          cargo +1.97.1 clippy --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --all-targets -- -D warnings 2>&1 | tee unrelated-cpu/clippy.log
          cargo +1.97.1 build --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --example schema_fitting 2>&1 | tee unrelated-cpu/candidate-build.log
          mkdir unrelated-cpu/frozen
          cp "$CARGO_TARGET_DIR/release/examples/schema_fitting" unrelated-cpu/frozen/candidate
          crate=crates/spiralcore-transfer
          baseline=56e15db5c77fe2ecdc03476d8e09664cd4213fd1
          printf '%s\n' "$baseline" > unrelated-cpu/baseline-production-revision.txt
          restore_candidate() {
            for file in src/delta.rs src/schema.rs Cargo.toml Cargo.lock; do
              git show "$GITHUB_SHA:$crate/$file" > "$crate/$file"
            done
          }
          trap restore_candidate EXIT
          for file in src/delta.rs src/schema.rs Cargo.toml Cargo.lock; do
            git show "$baseline:$crate/$file" > "$crate/$file"
          done
          sha256sum "$crate/src/delta.rs" "$crate/src/schema.rs" "$crate/Cargo.toml" "$crate/Cargo.lock" > unrelated-cpu/baseline-overlay.sha256
          cargo +1.97.1 build --release --locked --manifest-path "$crate/Cargo.toml" --example schema_fitting 2>&1 | tee unrelated-cpu/baseline-build.log
          cp "$CARGO_TARGET_DIR/release/examples/schema_fitting" unrelated-cpu/frozen/baseline
          restore_candidate
          trap - EXIT
          unrelated-cpu/frozen/candidate unrelated-identity > unrelated-cpu/candidate-identity.json
          unrelated-cpu/frozen/baseline unrelated-identity > unrelated-cpu/baseline-identity.json
          jq -e '.first_block_probe_available == true' unrelated-cpu/candidate-identity.json > unrelated-cpu/candidate-probe-enabled.txt
          jq -e '.first_block_probe_available == true' unrelated-cpu/baseline-identity.json > unrelated-cpu/baseline-probe-enabled.txt
          jq -e --slurpfile baseline unrelated-cpu/baseline-identity.json \
            '(.sources | del(.delta,.schema,.cargo_manifest,.lockfile)) == ($baseline[0].sources | del(.delta,.schema,.cargo_manifest,.lockfile)) and
             .sources.delta != $baseline[0].sources.delta and .sources.schema != $baseline[0].sources.schema and
             .sources.cargo_manifest != $baseline[0].sources.cargo_manifest and .sources.lockfile != $baseline[0].sources.lockfile and
             .platform == $baseline[0].platform and
             .hardware_sha256 == $baseline[0].hardware_sha256' \
            unrelated-cpu/candidate-identity.json > unrelated-cpu/identity-parity.txt
          sha256sum -c unrelated-cpu/source-files.sha256 > unrelated-cpu/source-after-build.log
          git diff --exit-code > unrelated-cpu/source-clean-after.log
          sha256sum unrelated-cpu/frozen/baseline unrelated-cpu/frozen/candidate > unrelated-cpu/binaries.sha256
          printf '%s\n' 'Common current harness; baseline overlays exactly delta.rs, schema.rs, Cargo.toml and Cargo.lock from56e15db, candidate uses current production. The direct memchr edge changes; its already-locked package version does not. Both selector arms use WarmSession and fit once/session; Whole uses the candidate unchanged encoder. Same Rust1.97.1 release/default features and probe guard. Actual seed/context/operation costs retained; no stage instrumentation.' > unrelated-cpu/build-profile.txt
      - name: Generate and validate the six registered shard plans
        shell: bash
        run: |
          set -euo pipefail
          for shard in $UNRELATED_SHARDS; do
            unrelated-cpu/frozen/candidate unrelated-plan "$SPIRALCORE_UNRELATED_RUN" "$shard" "unrelated-cpu/plan-$shard.json"
            jq -e --arg source "$GITHUB_SHA" --argjson cap "$UNRELATED_MAX_TRANSFERS_PER_SHARD" \
              --argjson store "$UNRELATED_MAX_STORE_BYTES" \
              '.source_commit == $source and (.sessions | type == "array" and length == 6) and
               .targets == 60 and .schema_fits == 4 and
               (.operations | type == "number" and floor == . and . >= 66 and . <= $cap) and
               (.conservative_storage_bound | type == "number" and floor == . and . >= 0 and . <= $store) and
               .cold_graph_warming == false and .codec_cache_enabled == true and .warm_probe == false and
               .http_keep_alive == {idle_timeout_ms:500,max_requests_per_connection:32}' \
              "unrelated-cpu/plan-$shard.json" > "unrelated-cpu/plan-$shard-qualified.txt"
          done
          sha256sum unrelated-cpu/plan-*.json > unrelated-cpu/plans.sha256
      - name: Run the one registered pilot sequentially without retries
        timeout-minutes: 20
        env:
          SPIRALCORE_WAN_TOKEN: ${{ secrets.SPIRALCORE_UNRELATED_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # BEGIN AUTH GATE
          [[ "${SPIRALCORE_WAN_TOKEN:-}" =~ ^[0-9a-f]{64}$ ]] || exit 1
          # END AUTH GATE
          sha256sum -c unrelated-cpu/binaries.sha256 > unrelated-cpu/binaries-before-transfer.log
          sha256sum -c unrelated-cpu/plans.sha256 > unrelated-cpu/plans-before-transfer.log
          for shard in $UNRELATED_SHARDS; do
            key="UNRELATED_URL_$shard"
            date -u +%FT%TZ > "unrelated-cpu/start-$shard.txt"
            unrelated-cpu/frozen/candidate unrelated-paired "unrelated-cpu/plan-$shard.json" \
              unrelated-cpu/frozen/baseline unrelated-cpu/frozen/candidate "${!key}" \
              "$UNRELATED_RECEIVER_SHA" "unrelated-cpu/observations-$shard.jsonl" \
              2>&1 | tee "unrelated-cpu/remote-$shard.log"
            date -u +%FT%TZ > "unrelated-cpu/end-$shard.txt"
          done
          sha256sum -c unrelated-cpu/binaries.sha256 > unrelated-cpu/binaries-after-transfer.log
          printf '%s\n' 'Sender complete. Stop receivers and regenerate/reopen every object before asserting exact-byte WAN success.' > unrelated-cpu/receiver-verification-pending.txt
      - name: Seal all available evidence including failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unrelated-cpu
          find unrelated-cpu -type f ! -name artifact-sha256.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > unrelated-cpu/artifact-sha256.txt
      - name: Retain results and both frozen senders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spiralcore-unrelated-cpu-${{ github.run_id }}-${{ github.sha }}
          path: unrelated-cpu/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
