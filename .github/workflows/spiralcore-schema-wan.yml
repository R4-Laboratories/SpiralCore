name: SpiralCore persistent schema WAN comparison
on:
  push:
    branches: [codex/spiralcore-schema-wan]
permissions:
  contents: read
concurrency:
  group: spiralcore-schema-wan
  cancel-in-progress: false
jobs:
  measure:
    if: github.ref == 'refs/heads/codex/spiralcore-schema-wan' && github.sha == vars.SPIRALCORE_SCHEMA_SOURCE && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: 0
      SPIRALCORE_SCHEMA_SOURCE: ${{ vars.SPIRALCORE_SCHEMA_SOURCE }}
      SPIRALCORE_SCHEMA_RUN: ${{ vars.SPIRALCORE_SCHEMA_RUN }}
      SCHEMA_RECEIVER_SHA: ${{ vars.SPIRALCORE_SCHEMA_RECEIVER_SHA256 }}
      SCHEMA_URL_0: ${{ vars.SPIRALCORE_SCHEMA_URL_0 }}
      SCHEMA_URL_1: ${{ vars.SPIRALCORE_SCHEMA_URL_1 }}
      SCHEMA_URL_2: ${{ vars.SPIRALCORE_SCHEMA_URL_2 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate source and bounded receiver configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir schema-wan
          # BEGIN CONFIG GATE
          [[ "$GITHUB_REF" == refs/heads/codex/spiralcore-schema-wan ]] || exit 1
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || exit 1
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$SPIRALCORE_SCHEMA_SOURCE" ]] || exit 1
          [[ "$SPIRALCORE_SCHEMA_RUN" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$SCHEMA_RECEIVER_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          for key in SCHEMA_URL_0 SCHEMA_URL_1 SCHEMA_URL_2; do
            url="${!key}"
            [[ "$url" =~ ^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.trycloudflare\.com/?$ ]] || exit 1
          done
          # END CONFIG GATE
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ ! -e "$CARGO_TARGET_DIR" ]] || exit 1
          [[ -z "${RUSTFLAGS:-}${CARGO_ENCODED_RUSTFLAGS:-}${RUSTC_WRAPPER:-}${RUSTC_WORKSPACE_WRAPPER:-}${CARGO_BUILD_TARGET:-}" ]] || exit 1
          git diff --exit-code > schema-wan/source-clean-before.log
          git rev-parse HEAD > schema-wan/source-revision.txt
          jq -n --arg source "$GITHUB_SHA" --arg run "$SPIRALCORE_SCHEMA_RUN" \
            --arg receiver "$SCHEMA_RECEIVER_SHA" --arg workflow_run "$GITHUB_RUN_ID" \
            --arg url0 "$SCHEMA_URL_0" --arg url1 "$SCHEMA_URL_1" --arg url2 "$SCHEMA_URL_2" \
            '{schema:"spiralcore.schema-wan.workflow.v1",source:$source,run:$run,
              receiver_executable_sha256_operator_supplied:$receiver,
              urls:[$url0,$url1,$url2],github_run_id:$workflow_run,github_run_attempt:1,
              shards:3,trials_per_size:30,sessions:180,targets:1800,seeds:120,
              byte_scope:"request and response HTTP bodies; not full-path packet bytes"}' \
            > schema-wan/registration.json
      - name: Install compiler and record the Linux sender
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy 2>&1 | tee schema-wan/toolchain-install.log
          rustc +1.97.1 -vV > schema-wan/rustc.txt
          [[ "$(sed -n 's/^host: //p' schema-wan/rustc.txt)" == x86_64-unknown-linux-gnu ]] || exit 1
          uname -a > schema-wan/platform.txt
          lscpu -J > schema-wan/cpu.json
          cargo +1.97.1 tree --locked --manifest-path crates/spiralcore-transfer/Cargo.toml -e features > schema-wan/features.txt
          git ls-files -z -- crates/spiralcore-transfer crates/uor-r4-object-store/src \
            .github/workflows/spiralcore-schema-wan.yml \
            | sort -z | xargs -0 sha256sum > schema-wan/source-files.sha256
      - name: Qualify and freeze optimized sender with the common harness
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 test --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --all-targets 2>&1 | tee schema-wan/candidate-tests.log
          cargo +1.97.1 clippy --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --all-targets -- -D warnings 2>&1 | tee schema-wan/clippy.log
          cargo +1.97.1 build --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --example schema_fitting 2>&1 | tee schema-wan/candidate-build.log
          mkdir schema-wan/frozen
          cp "$CARGO_TARGET_DIR/release/examples/schema_fitting" schema-wan/frozen/candidate
          cp crates/spiralcore-transfer/src/schema.rs schema-wan/candidate-schema.rs
      - name: Freeze source-derived baseline changing only the encoder
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          schema=crates/spiralcore-transfer/src/schema.rs
          fixture=crates/spiralcore-transfer/tests/fixtures/schema_sender_baseline.rs
          [[ "$(sha256sum "$fixture" | cut -d ' ' -f 1)" == 6c228201197e1ce26a6ac8137da490e0040ed26ab06d4576b330e8b240a2577a ]] || exit 1
          [[ "$(sha256sum "$schema" | cut -d ' ' -f 1)" == 8c81c80b94faf4579a9875a825e47575b61652b9e4c03130ab6bc783e2905109 ]] || exit 1
          trap 'cp schema-wan/candidate-schema.rs crates/spiralcore-transfer/src/schema.rs' EXIT
          cp "$fixture" "$schema"
          git diff --binary -- "$schema" > schema-wan/baseline-derived.patch
          [[ "$(git diff --name-only)" == "$schema" ]] || exit 1
          cargo +1.97.1 test --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --test schema_codec --test schema_prepared --test schema_reuse 2>&1 | tee schema-wan/baseline-tests.log
          cargo +1.97.1 build --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --example schema_fitting 2>&1 | tee schema-wan/baseline-build.log
          cp "$CARGO_TARGET_DIR/release/examples/schema_fitting" schema-wan/frozen/baseline
          cp schema-wan/candidate-schema.rs "$schema"
          trap - EXIT
          sha256sum -c schema-wan/source-files.sha256 > schema-wan/source-after-build.log
          git diff --exit-code > schema-wan/source-clean-after.log
          sha256sum schema-wan/frozen/baseline schema-wan/frozen/candidate > schema-wan/binaries.sha256
          printf '%s\n' 'Both senders use this source revision and harness. Baseline replaces only schema.rs with the pinned SC-OPT-012 fixture. Release/default features; Rust 1.97.1; fresh runner target with shared dependency artifacts; incremental disabled; no instrumentation.' > schema-wan/build-profile.txt
      - name: Generate the three registered shard plans
        shell: bash
        run: |
          set -euo pipefail
          for shard in 0 1 2; do
            schema-wan/frozen/candidate wan-plan "$SPIRALCORE_SCHEMA_RUN" "$shard" "schema-wan/plan-$shard.json"
          done
          sha256sum schema-wan/plan-*.json > schema-wan/plans.sha256
      - name: Run all paired sessions sequentially without retries
        timeout-minutes: 20
        env:
          SPIRALCORE_WAN_TOKEN: ${{ secrets.SPIRALCORE_SCHEMA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # BEGIN AUTH GATE
          [[ "${SPIRALCORE_WAN_TOKEN:-}" =~ ^[0-9a-f]{64}$ ]] || exit 1
          # END AUTH GATE
          sha256sum -c schema-wan/binaries.sha256 > schema-wan/binaries-before-transfer.log
          for shard in 0 1 2; do
            key="SCHEMA_URL_$shard"
            date -u +%FT%TZ > "schema-wan/start-$shard.txt"
            schema-wan/frozen/candidate wan-paired "schema-wan/plan-$shard.json" \
              schema-wan/frozen/baseline schema-wan/frozen/candidate "${!key}" \
              "$SCHEMA_RECEIVER_SHA" "schema-wan/observations-$shard.jsonl" \
              2>&1 | tee "schema-wan/remote-$shard.log"
            date -u +%FT%TZ > "schema-wan/end-$shard.txt"
          done
          sha256sum -c schema-wan/binaries.sha256 > schema-wan/binaries-after-transfer.log
          printf '%s\n' 'Sender complete. Stop receivers and regenerate/reopen every object before asserting exact-byte WAN success.' > schema-wan/receiver-verification-pending.txt
      - name: Seal all available evidence including failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p schema-wan
          find schema-wan -type f ! -name artifact-sha256.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > schema-wan/artifact-sha256.txt
      - name: Retain results and both frozen sender executables
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spiralcore-schema-wan-${{ github.run_id }}-${{ github.sha }}
          path: schema-wan/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
