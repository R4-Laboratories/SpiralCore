name: SpiralCore byte-first selection WAN comparison
on:
  push:
    branches: [codex/spiralcore-schema-selection]
permissions:
  contents: read
concurrency:
  group: spiralcore-schema-selection
  cancel-in-progress: false
jobs:
  measure:
    if: github.ref == 'refs/heads/codex/spiralcore-schema-selection' && github.sha == vars.SPIRALCORE_SELECTION_SOURCE && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: 0
      SPIRALCORE_SELECTION_SOURCE: ${{ vars.SPIRALCORE_SELECTION_SOURCE }}
      SPIRALCORE_SELECTION_RUN: ${{ vars.SPIRALCORE_SELECTION_RUN }}
      SELECTION_RECEIVER_SHA: ${{ vars.SPIRALCORE_SELECTION_RECEIVER_SHA256 }}
      SELECTION_URL_0: ${{ vars.SPIRALCORE_SELECTION_URL_0 }}
      SELECTION_URL_1: ${{ vars.SPIRALCORE_SELECTION_URL_1 }}
      SELECTION_URL_2: ${{ vars.SPIRALCORE_SELECTION_URL_2 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate source and bounded receiver configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir schema-selection
          # BEGIN CONFIG GATE
          [[ "$GITHUB_REF" == refs/heads/codex/spiralcore-schema-selection ]] || exit 1
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || exit 1
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$SPIRALCORE_SELECTION_SOURCE" ]] || exit 1
          [[ "$SPIRALCORE_SELECTION_RUN" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$SELECTION_RECEIVER_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          for key in SELECTION_URL_0 SELECTION_URL_1 SELECTION_URL_2; do
            url="${!key}"
            [[ "$url" =~ ^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.trycloudflare\.com/?$ ]] || exit 1
          done
          # END CONFIG GATE
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ ! -e "$CARGO_TARGET_DIR" ]] || exit 1
          [[ -z "${RUSTFLAGS:-}${CARGO_ENCODED_RUSTFLAGS:-}${RUSTC_WRAPPER:-}${RUSTC_WORKSPACE_WRAPPER:-}${CARGO_BUILD_TARGET:-}" ]] || exit 1
          git diff --exit-code > schema-selection/source-clean-before.log
          git rev-parse HEAD > schema-selection/source-revision.txt
          jq -n --arg source "$GITHUB_SHA" --arg run "$SPIRALCORE_SELECTION_RUN" \
            --arg receiver "$SELECTION_RECEIVER_SHA" --arg workflow_run "$GITHUB_RUN_ID" \
            --arg url0 "$SELECTION_URL_0" --arg url1 "$SELECTION_URL_1" --arg url2 "$SELECTION_URL_2" \
            '{schema:"spiralcore.schema-selection.workflow.v1",source:$source,run:$run,
              receiver_executable_sha256_operator_supplied:$receiver,
              urls:[$url0,$url1,$url2],github_run_id:$workflow_run,github_run_attempt:1,
              shards:3,trials_per_size:30,sessions:180,targets:1800,mandatory_schema_seeds:60,maximum_selector_seeds:60,
              byte_scope:"request and response HTTP bodies; not full-path packet bytes"}' \
            > schema-selection/registration.json
      - name: Install compiler and record the Linux sender
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy 2>&1 | tee schema-selection/toolchain-install.log
          rustc +1.97.1 -vV > schema-selection/rustc.txt
          [[ "$(sed -n 's/^host: //p' schema-selection/rustc.txt)" == x86_64-unknown-linux-gnu ]] || exit 1
          uname -a > schema-selection/platform.txt
          lscpu -J > schema-selection/cpu.json
          cargo +1.97.1 tree --locked --manifest-path crates/spiralcore-transfer/Cargo.toml -e features > schema-selection/features.txt
          git ls-files -z -- crates/spiralcore-transfer crates/uor-r4-object-store/src \
            .github/workflows/spiralcore-schema-selection.yml \
            | sort -z | xargs -0 sha256sum > schema-selection/source-files.sha256
      - name: Qualify and freeze one sender for all three arms
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 test --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --all-targets 2>&1 | tee schema-selection/candidate-tests.log
          cargo +1.97.1 clippy --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --all-targets -- -D warnings 2>&1 | tee schema-selection/clippy.log
          cargo +1.97.1 build --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --example schema_fitting 2>&1 | tee schema-selection/candidate-build.log
          mkdir schema-selection/frozen
          cp "$CARGO_TARGET_DIR/release/examples/schema_fitting" schema-selection/frozen/candidate
          sha256sum -c schema-selection/source-files.sha256 > schema-selection/source-after-build.log
          git diff --exit-code > schema-selection/source-clean-after.log
          sha256sum schema-selection/frozen/candidate > schema-selection/binaries.sha256
          printf '%s\n' 'All three arms use one source revision and executable: paid schema, matched whole-object zstd, and byte-first selection. Level3/window25/LDM/single-thread/checksum/content-size parameters are shared. Release/default features; Rust1.97.1; incremental disabled; no instrumentation.' > schema-selection/build-profile.txt
      - name: Generate the three registered shard plans
        shell: bash
        run: |
          set -euo pipefail
          for shard in 0 1 2; do
            schema-selection/frozen/candidate selection-plan "$SPIRALCORE_SELECTION_RUN" "$shard" "schema-selection/plan-$shard.json"
          done
          sha256sum schema-selection/plan-*.json > schema-selection/plans.sha256
      - name: Run all paired sessions sequentially without retries
        timeout-minutes: 20
        env:
          SPIRALCORE_WAN_TOKEN: ${{ secrets.SPIRALCORE_SELECTION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # BEGIN AUTH GATE
          [[ "${SPIRALCORE_WAN_TOKEN:-}" =~ ^[0-9a-f]{64}$ ]] || exit 1
          # END AUTH GATE
          sha256sum -c schema-selection/binaries.sha256 > schema-selection/binaries-before-transfer.log
          for shard in 0 1 2; do
            key="SELECTION_URL_$shard"
            date -u +%FT%TZ > "schema-selection/start-$shard.txt"
            schema-selection/frozen/candidate selection-paired "schema-selection/plan-$shard.json" \
              schema-selection/frozen/candidate "${!key}" \
              "$SELECTION_RECEIVER_SHA" "schema-selection/observations-$shard.jsonl" \
              2>&1 | tee "schema-selection/remote-$shard.log"
            date -u +%FT%TZ > "schema-selection/end-$shard.txt"
          done
          sha256sum -c schema-selection/binaries.sha256 > schema-selection/binaries-after-transfer.log
          printf '%s\n' 'Sender complete. Stop receivers and regenerate/reopen every object before asserting exact-byte WAN success.' > schema-selection/receiver-verification-pending.txt
      - name: Seal all available evidence including failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p schema-selection
          find schema-selection -type f ! -name artifact-sha256.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > schema-selection/artifact-sha256.txt
      - name: Retain results and the frozen sender executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spiralcore-schema-selection-${{ github.run_id }}-${{ github.sha }}
          path: schema-selection/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
