name: SpiralCore persistent sessions WAN
on:
  push:
    branches: [codex/spiralcore-persistent-session]
permissions:
  contents: read
concurrency:
  group: spiralcore-persistent-session
  cancel-in-progress: false
jobs:
  measure:
    if: github.ref == 'refs/heads/codex/spiralcore-persistent-session' && github.sha == vars.SPIRALCORE_PERSISTENT_SOURCE && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: 0
      SPIRALCORE_PERSISTENT_SOURCE: ${{ vars.SPIRALCORE_PERSISTENT_SOURCE }}
      SPIRALCORE_PERSISTENT_RUN: ${{ vars.SPIRALCORE_PERSISTENT_RUN }}
      PERSISTENT_RECEIVER_SHA: ${{ vars.SPIRALCORE_PERSISTENT_RECEIVER_SHA256 }}
      PERSISTENT_URL_0: ${{ vars.SPIRALCORE_PERSISTENT_URL_0 }}
      PERSISTENT_URL_1: ${{ vars.SPIRALCORE_PERSISTENT_URL_1 }}
      PERSISTENT_URL_2: ${{ vars.SPIRALCORE_PERSISTENT_URL_2 }}
      PERSISTENT_URL_3: ${{ vars.SPIRALCORE_PERSISTENT_URL_3 }}
      PERSISTENT_URL_4: ${{ vars.SPIRALCORE_PERSISTENT_URL_4 }}
      PERSISTENT_URL_5: ${{ vars.SPIRALCORE_PERSISTENT_URL_5 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate source and bounded receiver configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir persistent-session
          # BEGIN CONFIG GATE
          [[ "$GITHUB_REF" == refs/heads/codex/spiralcore-persistent-session ]] || exit 1
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || exit 1
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$SPIRALCORE_PERSISTENT_SOURCE" ]] || exit 1
          [[ "$SPIRALCORE_PERSISTENT_RUN" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$PERSISTENT_RECEIVER_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          for key in PERSISTENT_URL_0 PERSISTENT_URL_1 PERSISTENT_URL_2 PERSISTENT_URL_3 PERSISTENT_URL_4 PERSISTENT_URL_5; do
            url="${!key}"
            [[ "$url" =~ ^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.trycloudflare\.com/?$ ]] || exit 1
          done
          # END CONFIG GATE
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ ! -e "$CARGO_TARGET_DIR" ]] || exit 1
          [[ -z "${RUSTFLAGS:-}${CARGO_ENCODED_RUSTFLAGS:-}${RUSTC_WRAPPER:-}${RUSTC_WORKSPACE_WRAPPER:-}${CARGO_BUILD_TARGET:-}" ]] || exit 1
          git diff --exit-code > persistent-session/source-clean-before.log
          git rev-parse HEAD > persistent-session/source-revision.txt
          jq -n --arg source "$GITHUB_SHA" --arg run "$SPIRALCORE_PERSISTENT_RUN" \
            --arg receiver "$PERSISTENT_RECEIVER_SHA" --arg workflow_run "$GITHUB_RUN_ID" \
            --arg url0 "$PERSISTENT_URL_0" --arg url1 "$PERSISTENT_URL_1" --arg url2 "$PERSISTENT_URL_2" \
            --arg url3 "$PERSISTENT_URL_3" --arg url4 "$PERSISTENT_URL_4" --arg url5 "$PERSISTENT_URL_5" \
            '{schema:"spiralcore.persistent-session.workflow.v1",source:$source,run:$run,
              receiver_executable_sha256_operator_supplied:$receiver,
              urls:[$url0,$url1,$url2,$url3,$url4,$url5],github_run_id:$workflow_run,github_run_attempt:1,
              shards:6,trials_per_size:6,sizes:[1048576,16777216],sessions:36,targets:360,seeds:36,total_transfers:396,
              designation:"six-pair WAN pilot; not thirty-pair acceptance",updates_per_session:10,
              byte_scope:"request and response HTTP bodies; not full-path packet bytes"}' \
            > persistent-session/registration.json
      - name: Install compiler and record the Linux sender
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy 2>&1 | tee persistent-session/toolchain-install.log
          rustc +1.97.1 -vV > persistent-session/rustc.txt
          [[ "$(sed -n 's/^host: //p' persistent-session/rustc.txt)" == x86_64-unknown-linux-gnu ]] || exit 1
          uname -a > persistent-session/platform.txt
          lscpu -J > persistent-session/cpu.json
          cargo +1.97.1 tree --locked --manifest-path crates/spiralcore-transfer/Cargo.toml -e features > persistent-session/features.txt
          git ls-files -z -- crates/spiralcore-transfer crates/uor-r4-object-store/src \
            .github/workflows/spiralcore-persistent-session.yml \
            | sort -z | xargs -0 sha256sum > persistent-session/source-files.sha256
      - name: Qualify and freeze the common sender
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          SPIRALCORE_EXPECT_ZSTD_PROBE=enabled cargo +1.97.1 test --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --all-targets 2>&1 | tee persistent-session/candidate-tests.log
          cargo +1.97.1 clippy --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --all-targets -- -D warnings 2>&1 | tee persistent-session/clippy.log
          cargo +1.97.1 build --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --example schema_fitting 2>&1 | tee persistent-session/candidate-build.log
          mkdir persistent-session/frozen
          cp "$CARGO_TARGET_DIR/release/examples/schema_fitting" persistent-session/frozen/candidate
          persistent-session/frozen/candidate persistent-identity > persistent-session/candidate-identity.json
          jq -e '.first_block_probe_available == true' persistent-session/candidate-identity.json > persistent-session/candidate-probe-enabled.txt
          sha256sum -c persistent-session/source-files.sha256 > persistent-session/source-after-build.log
          git diff --exit-code > persistent-session/source-clean-after.log
          sha256sum persistent-session/frozen/candidate > persistent-session/binaries.sha256
          printf '%s\n' 'Common executable: fresh-selector uses public prepare_warm and ten contexts; persistent-selector uses WarmSession and one context; Whole uses one prepared encoder. Each selector fits once per session. All arms use a persistent HttpClient and pay an actual Raw seed. Same Rust1.97.1 release/default features; no receiver stage instrumentation.' > persistent-session/build-profile.txt
      - name: Generate the six registered shard plans
        shell: bash
        run: |
          set -euo pipefail
          for shard in 0 1 2 3 4 5; do
            persistent-session/frozen/candidate persistent-plan "$SPIRALCORE_PERSISTENT_RUN" "$shard" "persistent-session/plan-$shard.json"
          done
          sha256sum persistent-session/plan-*.json > persistent-session/plans.sha256
      - name: Run all paired sessions sequentially without retries
        timeout-minutes: 20
        env:
          SPIRALCORE_WAN_TOKEN: ${{ secrets.SPIRALCORE_PERSISTENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # BEGIN AUTH GATE
          [[ "${SPIRALCORE_WAN_TOKEN:-}" =~ ^[0-9a-f]{64}$ ]] || exit 1
          # END AUTH GATE
          sha256sum -c persistent-session/binaries.sha256 > persistent-session/binaries-before-transfer.log
          for shard in 0 1 2 3 4 5; do
            key="PERSISTENT_URL_$shard"
            date -u +%FT%TZ > "persistent-session/start-$shard.txt"
            persistent-session/frozen/candidate persistent-paired "persistent-session/plan-$shard.json" \
              persistent-session/frozen/candidate "${!key}" \
              "$PERSISTENT_RECEIVER_SHA" "persistent-session/observations-$shard.jsonl" \
              2>&1 | tee "persistent-session/remote-$shard.log"
            date -u +%FT%TZ > "persistent-session/end-$shard.txt"
          done
          sha256sum -c persistent-session/binaries.sha256 > persistent-session/binaries-after-transfer.log
          printf '%s\n' 'Sender complete. Stop receivers and regenerate/reopen every object before asserting exact-byte WAN success.' > persistent-session/receiver-verification-pending.txt
      - name: Seal all available evidence including failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p persistent-session
          find persistent-session -type f ! -name artifact-sha256.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > persistent-session/artifact-sha256.txt
      - name: Retain results and the frozen sender executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spiralcore-persistent-session-${{ github.run_id }}-${{ github.sha }}
          path: persistent-session/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
