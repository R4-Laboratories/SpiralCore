name: SpiralCore installed supervisor and resource contracts
on:
  pull_request:
    paths:
      - 'crates/spiralcore-mvm-live/src/host_budget.rs'
      - 'crates/spiralcore-mvm-live/src/host_budget/**'
      - 'crates/spiralcore-mvm-live/src/installed_owner.rs'
      - 'crates/spiralcore-mvm-live/src/installed_owner/**'
      - 'crates/spiralcore-mvm-live/src/installed_supervisor.rs'
      - 'crates/spiralcore-mvm-live/src/installed_supervisor/**'
      - 'crates/spiralcore-mvm-live/src/installed_resources.rs'
      - 'crates/spiralcore-mvm-live/src/installed_parent.rs'
      - 'crates/spiralcore-mvm-live/src/installed_parent/**'
      - 'docs/platforms/mvm-mailbox-portable.json'
      - 'crates/spiralcore-mvm-live/Cargo.toml'
      - 'crates/spiralcore-mvm-live/Cargo.lock'
      - 'crates/spiralcore-mvm-adapter/Cargo.toml'
      - 'crates/spiralcore-mvm-adapter/Cargo.lock'
      - 'crates/spiralcore-mvm-live/tests/installed-supervisor-harness/**'
      - '.github/workflows/spiralcore-installed-supervisor.yml'
permissions:
  contents: read
jobs:
  native-parent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {runner: macos-26, target: aarch64-apple-darwin}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      EXPECTED_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Bind actual native source
        run: |
          set -euo pipefail
          mkdir parent-evidence
          git rev-parse HEAD > parent-evidence/source-commit.txt
          [[ "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha }}" ]]
          uname -a > parent-evidence/platform.txt
          rustc +1.97.1 -vV > parent-evidence/rustc.txt
          grep -Fx "host: $EXPECTED_TARGET" parent-evidence/rustc.txt
          git ls-files -z -- crates/spiralcore-mvm-live/src/host_budget.rs \
            crates/spiralcore-mvm-live/src/host_budget \
            crates/spiralcore-mvm-live/src/installed_owner.rs \
            crates/spiralcore-mvm-live/src/installed_owner \
            crates/spiralcore-mvm-live/src/installed_supervisor.rs \
            crates/spiralcore-mvm-live/src/installed_supervisor \
            crates/spiralcore-mvm-live/src/installed_resources.rs \
            crates/spiralcore-mvm-live/tests/installed-supervisor-harness \
            | xargs -0 shasum -a 256 > parent-evidence/source.sha256
      - name: Exact production-file process and resource tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/installed-parent-target
        run: |
          set -euo pipefail
          cargo +1.97.1 test --release --locked \
            --manifest-path crates/spiralcore-mvm-live/tests/installed-supervisor-harness/Cargo.toml \
            --all-targets -- --test-threads=1 2>&1 | tee parent-evidence/tests.txt
          for expected in 38 3 11; do
            grep -E "^test result: ok\\. $expected passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in [0-9.]+s$" parent-evidence/tests.txt
          done
          shasum -a 256 -c parent-evidence/source.sha256 > parent-evidence/source-after.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-parent-${{ matrix.target }}-${{ github.run_attempt }}
          path: parent-evidence/
          retention-days: 14
  canonical-endpoint:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {runner: macos-26, target: aarch64-apple-darwin}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      EXPECTED_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Bind canonical adapter source
        run: |
          set -euo pipefail
          mkdir endpoint-evidence
          git rev-parse HEAD > endpoint-evidence/source-commit.txt
          [[ "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha }}" ]]
          rustc +1.97.1 -vV > endpoint-evidence/rustc.txt
          grep -Fx "host: $EXPECTED_TARGET" endpoint-evidence/rustc.txt
          git ls-files -z -- crates/spiralcore-mvm-live crates/spiralcore-mvm-adapter \
            crates/spiralcore-transfer crates/spiralcore-mvm-flowmux \
            crates/spiralcore-gateway-core crates/uor-r4-object-store \
            | xargs -0 shasum -a 256 > endpoint-evidence/source.sha256
      - name: Canonical parent store and original budget checks
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/canonical-endpoint-target
        run: |
          set -euo pipefail
          cargo +1.97.1 test --locked \
            --manifest-path crates/spiralcore-mvm-live/Cargo.toml \
            --features canonical-host --lib --no-run --message-format=json \
            > endpoint-evidence/build.jsonl 2> endpoint-evidence/build.stderr
          executable=$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "spiralcore_mvm_live" and .target.kind == ["lib"] and .profile.test and .executable) | .executable] | select(length == 1) | first' endpoint-evidence/build.jsonl)
          jq -es --arg root "$GITHUB_WORKSPACE/crates/spiralcore-mvm-live/" '[.[] | select(.reason == "compiler-artifact" and .target.name == "spiralcore_mvm_live" and .profile.test and .executable)] | length == 1 and all(.[]; .fresh == false and (.target.src_path | startswith($root)))' endpoint-evidence/build.jsonl
          [[ "$(realpath "$executable")" == "$(realpath "$CARGO_TARGET_DIR")"/debug/deps/* ]]
          echo "CANONICAL_TEST_EXECUTABLE=$executable" >> "$GITHUB_ENV"
          shasum -a 256 "$executable" > endpoint-evidence/executable-before.sha256
          "$executable" installed_parent::endpoint_tests:: --test-threads=1 \
            2>&1 | tee endpoint-evidence/tests.txt
          grep -E '^test result: ok\. 8 passed; 0 failed; 0 ignored; 0 measured;' endpoint-evidence/tests.txt
          shasum -a 256 -c endpoint-evidence/executable-before.sha256 > endpoint-evidence/executable-after.txt
          shasum -a 256 -c endpoint-evidence/source.sha256 > endpoint-evidence/source-after.txt
      - name: Collector-only profile keeps zero codec-store debit
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/canonical-endpoint-target
        run: |
          set -euo pipefail
          # The canonical controller refuses an unbounded or oversized main stack.
          ulimit -S -s > endpoint-evidence/stack-before-kib.txt
          ulimit -S -s 8192
          ulimit -S -s > endpoint-evidence/stack-configured-kib.txt
          test "$(ulimit -S -s)" = 8192
          cargo +1.97.1 test --locked \
            --manifest-path crates/spiralcore-mvm-live/Cargo.toml \
            --features canonical-host --lib installed_parent::collector_tests:: \
            -- --test-threads=1 2>&1 | tee endpoint-evidence/collector-tests.txt
          grep -E '^test result: ok\. 4 passed; 0 failed; 0 ignored; 0 measured;' endpoint-evidence/collector-tests.txt
          shasum -a 256 -c endpoint-evidence/source.sha256 > endpoint-evidence/source-after-collector.txt
      - name: Selected workers retain the original aggregate ceiling
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/canonical-endpoint-target
        run: |
          set -euo pipefail
          ulimit -S -s 8192
          cargo +1.97.1 test --locked \
            --manifest-path crates/spiralcore-mvm-live/Cargo.toml \
            --features canonical-host --lib installed_parent::config_tests::object_tcp_ \
            -- --test-threads=1 2>&1 | tee endpoint-evidence/worker-tests.txt
          grep -E '^test result: ok\. 2 passed; 0 failed; 0 ignored; 0 measured;' endpoint-evidence/worker-tests.txt
          shasum -a 256 -c endpoint-evidence/source.sha256 > endpoint-evidence/source-after-workers.txt
      - name: Original Root funds the selected child through populated-store retirement
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/canonical-endpoint-target
          CARGO_BUILD_JOBS: 2
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          set -euo pipefail
          ulimit -Sn 4096
          ulimit -S -s 8192
          evidence="$GITHUB_WORKSPACE/endpoint-evidence"
          cargo +1.97.1 metadata --locked --format-version=1 \
            --manifest-path crates/spiralcore-mvm-live/Cargo.toml --features canonical-host \
            > "$evidence/root-metadata.json"
          expected=$(jq -er .mvm_source docs/platforms/mvm-mailbox-portable.json)
          jq -e --arg expected "$expected" '[.packages[] | select(.name == "mvm-hostd")] | length == 1 and all(.[]; .source == $expected)' "$evidence/root-metadata.json"
          manifest=$(jq -er '.packages[] | select(.name == "mvm-hostd") | .manifest_path' "$evidence/root-metadata.json")
          mvm_root=${manifest%/crates/mvm-hostd/Cargo.toml}
          revision=${expected##*#}
          test "$(git -C "$mvm_root" rev-parse HEAD)" = "$revision"
          git -C "$mvm_root" rev-parse HEAD 'HEAD^{tree}' > "$evidence/root-mvm-source-and-tree.txt"
          git -C "$mvm_root" diff --exit-code HEAD -- > "$evidence/root-mvm-clean-before.txt"
          (
            cd "$mvm_root"
            git ls-files -z | xargs -0 sha256sum > "$evidence/root-mvm-source.sha256"
            find . -path ./.git -prune -o -path ./.cargo-ok -prune -o -type f -printf '%P\0' \
              | LC_ALL=C sort -z | xargs -0 sha256sum > "$evidence/root-mvm-file-set-before.sha256"
            cmp "$evidence/root-mvm-source.sha256" "$evidence/root-mvm-file-set-before.sha256"
          )
          finish_root() {
            rc=$?
            trap - EXIT
            if test -f "$evidence/root-executables-before.sha256"; then
              sha256sum -c "$evidence/root-executables-before.sha256" > "$evidence/root-executables-after.txt" || rc=90
            fi
            shasum -a 256 -c "$evidence/source.sha256" > "$evidence/source-after-root-store.txt" || rc=90
            (
              cd "$mvm_root" || exit 90
              sha256sum -c "$evidence/root-mvm-source.sha256" > "$evidence/root-mvm-source-after.txt" || exit 90
              find . -path ./.git -prune -o -path ./.cargo-ok -prune -o -type f -printf '%P\0' \
                | LC_ALL=C sort -z | xargs -0 sha256sum > "$evidence/root-mvm-file-set-after.sha256" || exit 90
              cmp "$evidence/root-mvm-source.sha256" "$evidence/root-mvm-file-set-after.sha256" || exit 90
              git diff --exit-code HEAD -- > "$evidence/root-mvm-clean-after.txt" || exit 90
            ) || rc=90
            printf '%s\n' "$rc" > "$evidence/root-exit.txt"
            exit "$rc"
          }
          trap finish_root EXIT
          /usr/bin/time -v -o "$evidence/root-helper-build-time.txt" \
            cargo +1.97.1 build --locked --manifest-path "$mvm_root/Cargo.toml" \
            -p mvm-hostd --bin mvm-host-agent --bin mvm-signer-helper --bin mvm-network-endpoint \
            --message-format=json > "$evidence/root-helper-build.jsonl" 2> "$evidence/root-helper-build.stderr"
          helpers=(mvm-host-agent mvm-signer-helper mvm-network-endpoint)
          for helper in "${helpers[@]}"; do
            jq -e -s --arg name "$helper" --arg path "$CARGO_TARGET_DIR/debug/$helper" \
              --arg root "$mvm_root/" \
              '[.[] | select(.reason == "compiler-artifact" and .target.name == $name and .executable)] | length == 1 and all(.[]; .executable == $path and (.target.src_path | startswith($root)))' \
              "$evidence/root-helper-build.jsonl"
          done
          sha256sum "$CANONICAL_TEST_EXECUTABLE" "${helpers[@]/#/$CARGO_TARGET_DIR/debug/}" \
            > "$evidence/root-executables-before.sha256"
          shasum -a 256 -c "$evidence/executable-before.sha256" > "$evidence/root-fixture-before.txt"
          export MVM_HOST_AGENT_PATH="$CARGO_TARGET_DIR/debug/mvm-host-agent"
          export MVM_SIGNER_HELPER_PATH="$CARGO_TARGET_DIR/debug/mvm-signer-helper"
          export MVM_SUBSTITUTION_ENDPOINT_PATH="$CARGO_TARGET_DIR/debug/mvm-network-endpoint"
          export MVM_HOME="$RUNNER_TEMP/root-store-home"
          TMPDIR=$(mktemp -d /tmp/sc-root.XXXXXXXX)
          export TMPDIR
          mkdir -m700 "$MVM_HOME"
          printf '%s\n' "$TMPDIR" > "$evidence/root-private-tmp.txt"
          /usr/bin/time -v -o "$evidence/root-store-time.txt" \
            "$CANONICAL_TEST_EXECUTABLE" \
            --exact installed_parent::store_load_tests::original_parent_funds_selected_child_populated_store_and_retirement \
            --ignored --nocapture --test-threads=1 > "$evidence/root-store-tests.txt" 2>&1
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;' "$evidence/root-store-tests.txt"
          printf 'scope=original Root and selected Linux host process; no VM boot or WAN\n' > "$evidence/root-scope.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canonical-endpoint-${{ matrix.target }}-${{ github.run_attempt }}
          path: endpoint-evidence/
          retention-days: 14
  native-store-consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {runner: macos-26, target: aarch64-apple-darwin}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      EXPECTED_TARGET: ${{ matrix.target }}
      MVM_DEV_ENV_KEEP_INHERITED: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Resolve the declared public consumer
        id: consumer
        run: |
          set -euo pipefail
          source=$(jq -er .mvm_source docs/platforms/mvm-mailbox-portable.json)
          prefix='git+https://github.com/Casey-allard/mvm?rev='
          [[ "$source" == "$prefix"* ]]
          revision=${source#"$prefix"}
          revision=${revision%%#*}
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source" == "$prefix$revision#$revision" ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          mkdir consumer-evidence
          printf '%s\n' "$source" > consumer-evidence/declared-source.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Casey-allard/mvm
          ref: ${{ steps.consumer.outputs.revision }}
          path: consumer
          persist-credentials: false
      - name: Install the declared Linux linker
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lld
          ld.lld --version
      - name: Bind native consumer source and exact shared core
        working-directory: consumer
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          evidence="$GITHUB_WORKSPACE/consumer-evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source-and-tree.txt"
          test "$(git rev-parse HEAD)" = '${{ steps.consumer.outputs.revision }}'
          printf 'soft=%s\nhard=%s\n' "$(ulimit -Sn)" "$(ulimit -Hn)" > "$evidence/host-nofile.txt"
          rustc +1.97.1 -vV > "$evidence/rustc.txt"
          grep -Fx "host: $EXPECTED_TARGET" "$evidence/rustc.txt"
          git ls-files -z | xargs -0 shasum -a 256 > "$evidence/source.sha256"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/consumer-target" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "MVM_HOME=$RUNNER_TEMP/consumer-home" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/consumer-tmp" >> "$GITHUB_ENV"
          mkdir -m700 "$RUNNER_TEMP/consumer-home" "$RUNNER_TEMP/consumer-tmp"
          cargo +1.97.1 metadata --locked --format-version 1 --filter-platform "$EXPECTED_TARGET" > "$RUNNER_TEMP/consumer-metadata.json"
          expected='git+https://github.com/R4-Laboratories/SpiralCore?rev=8994951b7c13fe5acf6f5ea3060ad4e51dc473c2#8994951b7c13fe5acf6f5ea3060ad4e51dc473c2'
          grep -F 'source = "git+https://github.com/R4-Laboratories/SpiralCore?' Cargo.lock > "$evidence/shared-core-lock-sources.txt"
          test "$(wc -l < "$evidence/shared-core-lock-sources.txt")" -eq 5
          test "$(sort -u "$evidence/shared-core-lock-sources.txt")" = "source = \"$expected\""
          awk '/^\[\[package\]\]$/ {name=""} /^name = / {name=$3; gsub(/"/, "", name)} /^source = "git[+]https:\/\/github.com\/R4-Laboratories\/SpiralCore\?/ {print name}' Cargo.lock | LC_ALL=C sort > "$evidence/shared-core-lock-names.txt"
          printf '%s\n' spiralcore-directory-macos spiralcore-mvm-flowmux spiralcore-storage-windows spiralcore-transfer uor-r4-object-store > "$evidence/expected-lock-names.txt"
          cmp "$evidence/shared-core-lock-names.txt" "$evidence/expected-lock-names.txt"
          native_names='["spiralcore-mvm-flowmux", "spiralcore-transfer", "uor-r4-object-store"]'
          if [[ "$RUNNER_OS" == macOS ]]; then
            native_names='["spiralcore-directory-macos", "spiralcore-mvm-flowmux", "spiralcore-transfer", "uor-r4-object-store"]'
          fi
          jq -e --arg expected "$expected" --argjson native_names "$native_names" '
            [.packages[] | select(.name | startswith("spiralcore-") or . == "uor-r4-object-store")] as $core |
            ($core | map(.name) | sort) == $native_names and
            all($core[]; .source == $expected)
          ' "$RUNNER_TEMP/consumer-metadata.json"
          jq '[.packages[] | select(.name | startswith("spiralcore-") or . == "uor-r4-object-store") | {name, version, source}]' \
            "$RUNNER_TEMP/consumer-metadata.json" > "$evidence/shared-core.json"
      - name: Execute original reader and store ownership controls
        working-directory: consumer
        run: |
          set -euo pipefail
          ulimit -S -s 8192
          source scripts/dev-env.sh
          evidence="$GITHUB_WORKSPACE/consumer-evidence"
          printf '%s\n' "$(ulimit -S -s)" > "$evidence/stack-configured-kib.txt"
          if cargo +1.97.1 test --locked -p mvm-hostd --lib --no-run --message-format=json > "$evidence/build.jsonl" 2> "$evidence/build.stderr"; then
            :
          else
            cat "$evidence/build.stderr" >&2
            jq -r 'select(.reason == "compiler-message") | .message.rendered // empty' "$evidence/build.jsonl" >&2
            exit 1
          fi
          executable=$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "mvm_hostd" and .target.kind == ["lib"] and .profile.test and .executable) | .executable] | select(length == 1) | first' "$evidence/build.jsonl")
          [[ "$(realpath "$executable")" == "$(realpath "$CARGO_TARGET_DIR")"/debug/deps/* ]]
          shasum -a 256 "$executable" > "$evidence/executable-before.sha256"
          "$executable" --list --format terse > "$evidence/test-list.txt"
          tests=(
            supervisor::endpoint::flowmux::owned_relays::custody_tests::close_between_core_creation_and_attach_retains_original_reader_until_join
            supervisor::endpoint::flowmux::owned_relays::custody_tests::poison_between_core_creation_and_attach_retains_original_reader_without_drain
            supervisor::endpoint::flowmux::spiralcore_payload::resource_pool_tests::replaced_installed_store_quarantines_original_locked_owner_after_endpoint_drop
            supervisor::endpoint::flowmux::spiralcore_payload::resource_pool_tests::partial_installed_store_retains_original_parent_name_and_debit
            supervisor::endpoint::flowmux::spiralcore_payload::resource_pool_tests::installed_store_workspace_is_charged_before_visits_are_available
            supervisor::endpoint::flowmux::spiralcore_payload::resource_pool_tests::store_cleanup_releases_only_exact_owned_identity_and_retains_failed_charge
            supervisor::endpoint::flowmux::spiralcore_payload::resource_pool_tests::installed_store_destruction_precedes_returned_credit
            supervisor::endpoint::flowmux::spiralcore_payload::resource_pool_tests::poisoned_store_ledger_retains_original_buffers_lock_and_debit
            installed_endpoint::controller::network::worker_tests::serial_worker_quote_includes_all_selected_concurrent_owners
            supervisor::endpoint::flowmux::credit_tests::returned_upload_credit_keeps_the_session_validator_current
            supervisor::endpoint::flowmux::spiralcore_payload::resource_pool_tests::owner_mode_tests::broad_mode_capture_refuses_and_retains_original_store_and_debit
            supervisor::endpoint::flowmux::spiralcore_payload::resource_pool_tests::owner_mode_tests::broad_mode_retirement_refuses_and_retains_original_lease_lock_and_debit
          )
          index=0
          for test in "${tests[@]}"; do
            grep -Fx "$test: test" "$evidence/test-list.txt"
            /usr/bin/time -p "$executable" --exact "$test" --show-output --test-threads=1 > "$evidence/control-$index.txt" 2>&1
            grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;' "$evidence/control-$index.txt"
            index=$((index + 1))
          done
          test "$index" -eq 12
          root_home=$(sudo -n mktemp -d "$RUNNER_TEMP/consumer-root-home.XXXXXX")
          root_tmp=$(sudo -n mktemp -d "$RUNNER_TEMP/consumer-root-tmp.XXXXXX")
          printf '%s\n%s\n' "$root_home" "$root_tmp" > "$evidence/root-fixture-paths.txt"
          privileged_tests=(
            supervisor::endpoint::flowmux::spiralcore_payload::resource_pool_tests::owner_mode_tests::foreign_uid_capture_refuses_and_retains_original_store_and_debit
            supervisor::endpoint::flowmux::spiralcore_payload::resource_pool_tests::owner_mode_tests::foreign_uid_retirement_refuses_and_retains_original_lease_lock_and_debit
          )
          for test in "${privileged_tests[@]}"; do
            grep -Fx "$test: test" "$evidence/test-list.txt"
            sudo -n env MVM_HOME="$root_home" TMPDIR="$root_tmp" \
              /usr/bin/time -p "$executable" --exact "$test" --ignored --show-output --test-threads=1 \
              > "$evidence/control-$index.txt" 2>&1
            grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;' "$evidence/control-$index.txt"
            index=$((index + 1))
          done
          test "$index" -eq 14
          test=supervisor::endpoint::flowmux::spiralcore_payload::resource_pool_tests::retirement_failure_tests::final_rmdir_refusal_retains_unlinked_owner_lease_and_original_debit
          grep -Fx "$test: test" "$evidence/test-list.txt"
          /usr/bin/time -p "$executable" --exact "$test" --ignored --show-output --test-threads=1 \
            > "$evidence/control-$index.txt" 2>&1
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;' "$evidence/control-$index.txt"
          grep -E '^FINAL_RMDIR_REFUSAL owner_links=0 original_lock_retained=true original_child_retained=true quarantined=1 active=1 resident_bytes=[1-9][0-9]* disk_bytes=[1-9][0-9]* carrier_bytes=[1-9][0-9]* refusal_wall_ns=[0-9]+ network_bytes=0$' "$evidence/control-$index.txt"
          index=$((index + 1))
          test "$index" -eq 15
          retention_tests=(
            supervisor::endpoint::flowmux::spiralcore_payload::resource_pool_tests::retention_slots_exist_before_first_reservation
            supervisor::endpoint::flowmux::spiralcore_payload::pool_close_tests::generic_parent_retention_is_funded_before_operations_and_survives_drain
            installed_endpoint::auxiliary_tests::store_retention_precedes_other_metadata_spending_and_cannot_be_reclaimed
            supervisor::endpoint::flowmux::spiralcore_payload::resource_pool_tests::installed_retention_tests::original_installed_metadata_permits_store_cleanup_after_admission_close
            supervisor::endpoint::flowmux::spiralcore_payload::resource_pool_tests::installed_retention_tests::original_installed_metadata_poison_retains_store_and_all_debits
          )
          for test in "${retention_tests[@]}"; do
            grep -Fx "$test: test" "$evidence/test-list.txt"
            /usr/bin/time -p "$executable" --exact "$test" --show-output --test-threads=1 > "$evidence/control-$index.txt" 2>&1
            grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;' "$evidence/control-$index.txt"
            index=$((index + 1))
          done
          test "$index" -eq 20
          expected_controls=20
          ordinary_controls=17
          if [[ "$RUNNER_OS" == Linux ]]; then
            test=supervisor::endpoint::flowmux::spiralcore_payload::resource_pool_tests::retirement_failure_tests::parent_fsync_refusal_after_rmdir_retains_original_lease_lock_and_debit
            grep -Fx "$test: test" "$evidence/test-list.txt"
            /usr/bin/time -p "$executable" --exact "$test" --show-output --test-threads=1 > "$evidence/control-$index.txt" 2>&1
            grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;' "$evidence/control-$index.txt"
            grep -E '^PARENT_FSYNC_REFUSAL errno_probe=9 first_cleanup_is_permit_drop=true child_links=0 owner_links=0 original_lock_retained=true original_lease_retained=true quarantined=1 active=1 resident_bytes=[1-9][0-9]* disk_bytes=[1-9][0-9]* carrier_bytes=[1-9][0-9]* cleanup_drop_wall_ns=[0-9]+ network_bytes=0 scope=funded_pool_fixture_no_registered_child$' "$evidence/control-$index.txt"
            index=$((index + 1))
            expected_controls=21
            ordinary_controls=18
          else
            printf 'NOT_RUN: Linux O_PATH parent-fsync refusal; no equivalent macOS gate claimed\n' > "$evidence/parent-fsync-platform.txt"
          fi
          shasum -a 256 "$executable" > "$evidence/executable-after.sha256"
          cmp "$evidence/executable-before.sha256" "$evidence/executable-after.sha256"
          shasum -a 256 -c "$evidence/source.sha256" > "$evidence/source-after.txt"
          test "$index" -eq "$expected_controls"
          grep -E '^STORE_DROP_ORDER called=true ledger_held=true returned_credit_visible=false original_owner_released=true retirement_wall_ns=[0-9]+$' "$evidence/control-6.txt"
          printf 'executed_controls=%s\nordinary_controls=%s\nexplicit_root_uid_controls=2\nexplicit_unprivileged_late_cleanup_controls=1\nscope=native host-process fixtures; no booted MVM or WAN\n' "$expected_controls" "$ordinary_controls" > "$evidence/counts.txt"
