name: SpiralCore installed supervisor and resource contracts
on:
  pull_request:
    paths:
      - 'crates/spiralcore-mvm-live/src/host_budget.rs'
      - 'crates/spiralcore-mvm-live/src/host_budget/**'
      - 'crates/spiralcore-mvm-live/src/installed_owner.rs'
      - 'crates/spiralcore-mvm-live/src/installed_owner/**'
      - 'crates/spiralcore-mvm-live/src/installed_supervisor.rs'
      - 'crates/spiralcore-mvm-live/src/installed_supervisor/**'
      - 'crates/spiralcore-mvm-live/src/installed_resources.rs'
      - 'crates/spiralcore-mvm-live/tests/installed-supervisor-harness/**'
      - '.github/workflows/spiralcore-installed-supervisor.yml'
permissions:
  contents: read
jobs:
  native-parent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {runner: macos-26, target: aarch64-apple-darwin}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      EXPECTED_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Bind actual native source
        run: |
          set -euo pipefail
          mkdir parent-evidence
          git rev-parse HEAD > parent-evidence/source-commit.txt
          [[ "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha }}" ]]
          uname -a > parent-evidence/platform.txt
          rustc +1.97.1 -vV > parent-evidence/rustc.txt
          grep -Fx "host: $EXPECTED_TARGET" parent-evidence/rustc.txt
          git ls-files -z -- crates/spiralcore-mvm-live/src/host_budget.rs \
            crates/spiralcore-mvm-live/src/host_budget \
            crates/spiralcore-mvm-live/src/installed_owner.rs \
            crates/spiralcore-mvm-live/src/installed_owner \
            crates/spiralcore-mvm-live/src/installed_supervisor.rs \
            crates/spiralcore-mvm-live/src/installed_supervisor \
            crates/spiralcore-mvm-live/src/installed_resources.rs \
            crates/spiralcore-mvm-live/tests/installed-supervisor-harness \
            | xargs -0 shasum -a 256 > parent-evidence/source.sha256
      - name: Exact production-file process and resource tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/installed-parent-target
        run: |
          set -euo pipefail
          cargo +1.97.1 test --release --locked \
            --manifest-path crates/spiralcore-mvm-live/tests/installed-supervisor-harness/Cargo.toml \
            --all-targets -- --test-threads=1 2>&1 | tee parent-evidence/tests.txt
          for expected in 33 3 11; do
            grep -E "^test result: ok\\. $expected passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in [0-9.]+s$" parent-evidence/tests.txt
          done
          shasum -a 256 -c parent-evidence/source.sha256 > parent-evidence/source-after.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-parent-${{ matrix.target }}-${{ github.run_attempt }}
          path: parent-evidence/
          retention-days: 14
