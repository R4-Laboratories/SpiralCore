name: SpiralCore installed carrier regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: startsWith(github.ref, 'refs/heads/codex/installed-sdk-native-witness-carrier-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: spiralcore
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Casey-allard/mvm
          ref: 11bf7c69b65dc6f32b898bcbc77193ebd999a9df
          path: sdk
          persist-credentials: false
      - name: Exercise installed carrier credit before TLS
        run: |
          set -euo pipefail
          test "$(git -C spiralcore rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C sdk rev-parse HEAD)" = "11bf7c69b65dc6f32b898bcbc77193ebd999a9df"
          rustup toolchain install 1.97.1 --profile minimal
          git -C sdk apply --check ../spiralcore/.github/qualification/installed-carrier.patch
          git -C sdk apply ../spiralcore/.github/qualification/installed-carrier.patch
          export CARGO_TARGET_DIR="$RUNNER_TEMP/sc-carrier"
          cargo +1.97.1 test --locked --manifest-path sdk/Cargo.toml -p mvm-hostd --lib \
            supervisor::flowmux::installed_carrier_tests:: -- --test-threads=1
