name: SpiralCore installed carrier regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: startsWith(github.ref, 'refs/heads/codex/installed-sdk-native-witness-carrier-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: spiralcore
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Casey-allard/mvm
          ref: 819938bf7f891654532e8b6830df5530e99eb464
          path: sdk
          persist-credentials: false
      - name: Exercise installed carrier credit before TLS
        run: |
          set -euo pipefail
          test "$(git -C spiralcore rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C sdk rev-parse HEAD)" = "819938bf7f891654532e8b6830df5530e99eb464"
          rustup toolchain install 1.97.1 --profile minimal
          export CARGO_TARGET_DIR="$RUNNER_TEMP/sc-carrier"
          cargo +1.97.1 test --locked --manifest-path sdk/Cargo.toml -p mvm-hostd --lib \
            supervisor::flowmux::installed_carrier_tests:: -- --test-threads=1
          cargo +1.97.1 test --locked --manifest-path sdk/Cargo.toml -p mvm-hostd --lib \
            supervisor::flowmux::spiralcore_payload:: -- --test-threads=1
          cargo +1.97.1 test --locked --manifest-path sdk/Cargo.toml -p mvm-hostd \
            --test installed_endpoint_resources -- --test-threads=1
