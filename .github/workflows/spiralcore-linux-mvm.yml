name: SpiralCore Firecracker witness preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: startsWith(github.ref, 'refs/heads/codex/installed-sdk-native-')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7d1eed92551ad9d89017f26ff8f6b61103465a27
          path: evidence
          persist-credentials: false
          sparse-checkout: docs/network/evidence/2026-11-05-native-preflight
      - name: Open KVM and create a blank VM
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/sc-kvm.XXXXXX")"
          cat > "$work/probe.c" <<'C'
          #include <fcntl.h>
          #include <linux/kvm.h>
          #include <stdio.h>
          #include <sys/ioctl.h>
          #include <unistd.h>

          int main(void) {
              int kvm = open("/dev/kvm", O_RDWR | O_CLOEXEC);
              if (kvm < 0) {
                  perror("open /dev/kvm");
                  return 1;
              }
              int api = ioctl(kvm, KVM_GET_API_VERSION, 0);
              if (api != KVM_API_VERSION) {
                  fprintf(stderr, "unexpected KVM API version %d\n", api);
                  return 1;
              }
              int vm = ioctl(kvm, KVM_CREATE_VM, 0);
              if (vm < 0) {
                  perror("KVM_CREATE_VM");
                  return 1;
              }
              close(vm);
              close(kvm);
              printf("KVM API %d, empty VM created and closed\n", api);
              return 0;
          }
          C
          cc -Wall -Wextra -Werror "$work/probe.c" -o "$work/probe"
          sudo -n -- "$work/probe"
      - name: Fetch and verify the exact public guest image inputs
        run: |
          set -euo pipefail
          packet="$GITHUB_WORKSPACE/evidence/docs/network/evidence/2026-11-05-native-preflight/native-asset-receipts.tar.xz"
          work="$(mktemp -d "$RUNNER_TEMP/sc-assets.XXXXXX")"
          cd "$work"
          tar -xJOf "$packet" receipt-freeze/official.sha256 > official.sha256
          test "$(wc -l < official.sha256)" -eq 9
          while read -r digest name; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ && "$name" =~ ^[a-zA-Z0-9._-]+$ && "$name" != -* ]]
            curl --fail --silent --show-error --location --retry 2 --max-time 90 \
              --output "$name" "https://github.com/tinylabscom/mvm-images/releases/download/image-set%2Fv0.2.4/$name"
          done < official.sha256
          sha256sum --strict -c official.sha256
