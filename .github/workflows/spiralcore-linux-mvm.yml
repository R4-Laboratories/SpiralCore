name: SpiralCore installed endpoint binary regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: startsWith(github.ref, 'refs/heads/codex/installed-sdk-native-witness-endpoint-binary-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: spiralcore
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Casey-allard/mvm
          ref: 78da22eb6104ce9bbe9e4ebebba4ab81ccad7326
          path: sdk
          persist-credentials: false
      - name: Exercise canonical installed endpoint binary dispatch
        run: |
          set -euo pipefail
          test "$(git -C spiralcore rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C sdk rev-parse HEAD)" = "78da22eb6104ce9bbe9e4ebebba4ab81ccad7326"
          rustup toolchain install 1.97.1 --profile minimal
          git -C sdk apply --check ../spiralcore/.github/qualification/endpoint-binary.patch
          git -C sdk apply ../spiralcore/.github/qualification/endpoint-binary.patch
          export CARGO_TARGET_DIR="$RUNNER_TEMP/sc-endpoint-binary"
          cargo +1.97.1 test --locked --manifest-path sdk/Cargo.toml -p mvm-hostd --test installed_endpoint_resources \
            canonical_endpoint_binary_enters_installed_stdio_before_legacy_input -- --test-threads=1
