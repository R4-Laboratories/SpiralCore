name: SpiralCore hosted Firecracker scope preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    if: startsWith(github.ref, 'refs/heads/codex/installed-sdk-native-witness-scope-')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify actual cgroup limits in a temporary user scope
        run: |
          set -euo pipefail
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          uid=$(id -u)
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          if ! systemctl --user show-environment >/dev/null 2>&1; then
            sudo -n systemctl start "user@$uid.service"
          fi
          systemctl --user show-environment >/dev/null
          unit="spiralcore-qual-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          systemd-run --user --scope --quiet --unit "$unit" \
            -p CPUQuota=100% -p MemoryMax=128M -p MemorySwapMax=0 \
            -p TasksMax=32 -p OOMPolicy=stop -- \
            /usr/bin/bash -euo pipefail -c '
              group=$(sed -n "s/^0:://p" /proc/self/cgroup)
              [[ "$group" = */"$1".scope ]]
              path="/sys/fs/cgroup$group"
              read -r quota period < "$path/cpu.max"
              test "$quota" = "$period"
              test "$(cat "$path/memory.max")" = 134217728
              test "$(cat "$path/memory.swap.max")" = 0
              test "$(cat "$path/pids.max")" = 32
              printf "scope=%s cpu.max=%s/%s memory.max=134217728 swap.max=0 pids.max=32\n" "$1" "$quota" "$period"
            ' scope-readback "$unit"
          state=$(systemctl --user is-active "$unit.scope" || :)
          [[ "$state" = inactive || "$state" = unknown ]]
          printf 'scope retired: %s\n' "$state"
