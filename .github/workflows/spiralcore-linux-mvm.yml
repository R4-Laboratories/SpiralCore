name: SpiralCore Darwin owned registration compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: startsWith(github.ref, 'refs/heads/codex/installed-sdk-native-witness-darwin-registered-audit-')
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: spiralcore
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Casey-allard/mvm
          ref: ec723f60d0abce8f8a77ea4a80ec23b8fba9674f
          path: sdk
          persist-credentials: false
      - name: Exercise the original host-agent and signer registration
        run: |
          set -euo pipefail
          test "$(git -C spiralcore rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C sdk rev-parse HEAD)" = "ec723f60d0abce8f8a77ea4a80ec23b8fba9674f"
          test "$(uname -m)" = arm64
          sw_vers
          uname -r
          rustup toolchain install 1.97.1 --profile minimal
          export CARGO_TARGET_DIR="$RUNNER_TEMP/sc-registered-audit"
          cargo +1.97.1 test --locked --manifest-path sdk/Cargo.toml -p mvm-hostd --test owned_host_agent installed_signer_requires_the_original_current_registration -- --test-threads=1
