name: SpiralCore signed installed Prepare producer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: startsWith(github.ref, 'refs/heads/codex/installed-sdk-native-witness-prepare-producer-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: spiralcore
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Casey-allard/mvm
          ref: 94cefe582f157e301fe716e563d5c43734793127
          path: sdk
          persist-credentials: false
      - name: Exercise signed producer and canonical endpoint bootstrap
        run: |
          set -euo pipefail
          test "$(git -C spiralcore rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C sdk rev-parse HEAD)" = "94cefe582f157e301fe716e563d5c43734793127"
          rustup toolchain install 1.97.1 --profile minimal
          export CARGO_TARGET_DIR="$RUNNER_TEMP/sc-prepare-audit"
          cargo +1.97.1 test --locked --manifest-path sdk/Cargo.toml -p mvm-hostd --test owned_host_agent --test installed_endpoint_resources -- --test-threads=1
          cargo +1.97.1 test --locked --manifest-path sdk/Cargo.toml -p mvm-vmm --lib host::network_endpoint_spawn:: -- --test-threads=1
          cargo +1.97.1 test --locked --manifest-path sdk/Cargo.toml -p mvm-core --test bounded_owned_json -- --test-threads=1
          cargo +1.97.1 test --locked --manifest-path sdk/Cargo.toml -p mvm-vmm --lib host::telemetry_provisioning::tests:: -- --test-threads=1
