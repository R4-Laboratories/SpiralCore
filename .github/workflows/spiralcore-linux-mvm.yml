name: SpiralCore installed audited endpoint controller

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: startsWith(github.ref, 'refs/heads/codex/installed-sdk-native-witness-installed-controller-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: spiralcore
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Casey-allard/mvm
          ref: c13e50d74bae2cd224a063116e88129b2e195bec
          path: sdk
          persist-credentials: false
      - name: Exercise actual audited controller Ready and original retirement
        run: |
          set -euo pipefail
          test "$(git -C spiralcore rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C sdk rev-parse HEAD)" = "c13e50d74bae2cd224a063116e88129b2e195bec"
          rustup toolchain install 1.97.1 --profile minimal
          git -C sdk apply --check ../spiralcore/.github/qualification/controller.patch
          git -C sdk apply ../spiralcore/.github/qualification/controller.patch
          export CARGO_TARGET_DIR="$RUNNER_TEMP/sc-prepare-audit"
          cargo +1.97.1 test --locked --manifest-path sdk/Cargo.toml -p mvm-hostd --test owned_host_agent signed_parent_starts_and_retires_canonical_audited_controller -- --test-threads=1
