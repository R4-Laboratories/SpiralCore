name: SpiralCore signed installed Prepare producer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: startsWith(github.ref, 'refs/heads/codex/installed-sdk-native-witness-prepare-producer-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: spiralcore
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Casey-allard/mvm
          ref: 1102ef8d5334ac1dabef45361eb6421f1f873bc5
          path: sdk
          persist-credentials: false
      - name: Exercise inherited audit and records in the canonical endpoint
        run: |
          set -euo pipefail
          test "$(git -C spiralcore rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C sdk rev-parse HEAD)" = "1102ef8d5334ac1dabef45361eb6421f1f873bc5"
          rustup toolchain install 1.97.1 --profile minimal
          git -C sdk apply --check ../spiralcore/.github/qualification/prepare-producer.patch
          git -C sdk apply ../spiralcore/.github/qualification/prepare-producer.patch
          export CARGO_TARGET_DIR="$RUNNER_TEMP/sc-prepare-audit"
          cargo +1.97.1 test --locked --manifest-path sdk/Cargo.toml -p mvm-hostd --test owned_host_agent signed_parent_delivers_original_audit_and_records_to_canonical_child -- --test-threads=1
