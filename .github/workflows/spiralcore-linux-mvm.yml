name: SpiralCore installed SDK validation

on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact MVM fork commit to build
        required: true
        type: string
      hostd:
        description: Include Hostd admission and local run tests
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sdk:
    if: startsWith(github.ref, 'refs/heads/codex/installed-sdk-validation-')
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Validate requested fork commit
        env:
          SOURCE: ${{ inputs.source }}
        run: '[[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Casey-allard/mvm
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Test portable bundle preparation and SDK dispatch
        env:
          SOURCE: ${{ inputs.source }}
          HOSTD: ${{ inputs.hostd }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          rustup toolchain install 1.97.1 --profile minimal
          if [[ "$HOSTD" == true ]]; then
            cargo +1.97.1 test --locked -p mvm-hostd --lib plan_admission::tests
            cargo +1.97.1 test --locked -p mvm-hostd --lib run::
          fi
          cargo +1.97.1 test --locked -p mvm-client --lib launch::bundle_runtime::tests
          cargo +1.97.1 test --locked -p mvm-runtime --lib bundle_runtime::tests
      - name: Inspect runner virtualization availability
        if: always()
        run: |
          if [[ -c /dev/kvm ]]; then
            stat -c 'KVM device type=%F owner=%U group=%G mode=%a' /dev/kvm
          else
            echo 'KVM device absent'
          fi
