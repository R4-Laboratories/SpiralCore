name: SpiralCore installed Runtime broker regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: startsWith(github.ref, 'refs/heads/codex/installed-sdk-native-witness-runtime-broker-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: spiralcore
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Casey-allard/mvm
          ref: d3d7272004ba01b0834719848eaf3b585bc75457
          path: sdk
          persist-credentials: false
      - name: Exercise original installed Runtime broker registration
        run: |
          set -euo pipefail
          test "$(git -C spiralcore rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C sdk rev-parse HEAD)" = "d3d7272004ba01b0834719848eaf3b585bc75457"
          rustup toolchain install 1.97.1 --profile minimal
          git -C sdk apply --check ../spiralcore/.github/qualification/runtime-broker.patch
          git -C sdk apply ../spiralcore/.github/qualification/runtime-broker.patch
          export CARGO_TARGET_DIR="$RUNNER_TEMP/sc-runtime-broker"
          cargo +1.97.1 test --locked --manifest-path sdk/Cargo.toml -p mvm-hostd --test owned_host_agent \
            installed_runtime_broker_uses_the_original_registrar_even_without_services -- --test-threads=1
