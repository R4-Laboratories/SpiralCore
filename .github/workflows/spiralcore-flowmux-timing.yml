name: SpiralCore Windows storage layout control
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spiralcore-storage-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  same-executable:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Register bounded native storage comparison
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Native Windows x64 required' }
          New-Item -ItemType Directory storage-evidence | Out-Null
          $roots = @(@{ label = 'default'; path = [System.IO.Path]::GetTempPath() })
          $alternate = if ([System.IO.Path]::GetPathRoot($roots[0].path) -ieq 'D:\') { 'C:\' } else { 'D:\' }
          $alternateState = 'UNAVAILABLE'
          if (Test-Path -LiteralPath $alternate -PathType Container) {
            if ([System.IO.Path]::GetPathRoot($roots[0].path) -ine $alternate) {
              $roots += @{ label = 'alternate'; path = (Join-Path $alternate "sc-storage-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT") }
              $alternateState = 'REGISTERED'
            } else { $alternateState = 'SAME_VOLUME_AS_DEFAULT' }
          }
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Source identity failed' }
          @{ source = $source; run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT;
            image = $env:ImageVersion; roots = $roots; alternate = $alternateState;
            order = 'default then alternate, exploratory fixed order'; runner_temp = $env:RUNNER_TEMP; original_tmp = $env:TMP; original_temp = $env:TEMP;
            operation_seconds = 2; workload_seconds = 240; process_watchdog_seconds = 270; blocks_each_direction = 4096;
            scope = 'same compiled native executable; authenticated component; no MVM or WAN'
          } | ConvertTo-Json -Depth 6 | Set-Content storage-evidence/plan.json
          Get-Volume | Select-Object DriveLetter, FileSystem, DriveType, Size, SizeRemaining |
            ConvertTo-Json | Set-Content storage-evidence/volumes.json
          Get-Partition | Where-Object { $_.DriveLetter -in @('C', 'D') } |
            Select-Object DriveLetter, DiskNumber, Size | ConvertTo-Json | Set-Content storage-evidence/partitions.json
      - name: Build one pinned native sustained executable
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust unavailable' }
          rustc +1.97.1-x86_64-pc-windows-msvc -vV | Set-Content storage-evidence/rustc.txt
          if ($LASTEXITCODE -ne 0 -or !(Select-String -Path storage-evidence/rustc.txt -SimpleMatch 'host: x86_64-pc-windows-msvc')) { throw 'Native toolchain required' }
          $manifest = (Resolve-Path crates/spiralcore-mvm-flowmux/Cargo.toml).Path
          $artifacts = @(& cargo +1.97.1-x86_64-pc-windows-msvc test --release --locked --manifest-path $manifest --features witness-timing --test ordered_stream --no-run --message-format=json |
            ForEach-Object { ConvertFrom-Json -InputObject $_ } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.manifest_path -eq $manifest -and $_.target.name -eq 'ordered_stream' -and $_.profile.test -eq $true -and $_.features -contains 'witness-timing' -and $_.executable })
          if ($LASTEXITCODE -ne 0 -or $artifacts.Count -ne 1) { throw 'Expected one sustained executable' }
          $exe = (Get-Item -LiteralPath $artifacts[0].executable).FullName
          @{ path = $exe; length = (Get-Item -LiteralPath $exe).Length;
            sha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content storage-evidence/executable.json
      - name: Execute both registered roots without fallback
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $plan = Get-Content storage-evidence/plan.json -Raw | ConvertFrom-Json
          $binary = Get-Content storage-evidence/executable.json -Raw | ConvertFrom-Json
          $originalTmp = $env:TMP
          $originalTemp = $env:TEMP
          $failed = $false
          try {
            foreach ($root in $plan.roots) {
              $owned = $root.label -eq 'alternate'
              if ($owned) {
                try { New-Item -ItemType Directory -Path $root.path | Out-Null }
                catch {
                  @{ label = $root.label; status = 'UNAVAILABLE_PREPARATION'; passed = $false; hresult = $_.Exception.HResult } |
                    ConvertTo-Json | Set-Content "storage-evidence/$($root.label).result.json"
                  $failed = $true
                  continue
                }
              }
              try {
                $env:TMP = $root.path
                $env:TEMP = $root.path
                $stdout = Join-Path (Resolve-Path storage-evidence).Path "$($root.label).stdout.txt"
                $stderr = Join-Path (Resolve-Path storage-evidence).Path "$($root.label).stderr.txt"
                $process = Start-Process -FilePath $binary.path -ArgumentList @('--show-output', '--test-threads=1', '--color', 'never') -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
                try {
                  $timedOut = !$process.WaitForExit(270000)
                  if ($timedOut) { $process.Kill($true) }
                  $process.WaitForExit()
                  $code = $process.ExitCode
                } finally { $process.Dispose() }
                # Preserve separate streams before validating root selection; concatenation is not temporal order.
                $log = [string](Get-Content -LiteralPath $stdout -Raw) + [string](Get-Content -LiteralPath $stderr -Raw)
                $log | Write-Output
                $observed = [regex]::Match($log, '(?m)^ORDERED_STORAGE_ROOT temp=(.+)\r?$')
                $rootMatches = $observed.Success -and [System.IO.Path]::GetFullPath($observed.Groups[1].Value.Trim()).TrimEnd('\') -ieq [System.IO.Path]::GetFullPath($root.path).TrimEnd('\')
                $passed = !$timedOut -and $code -eq 0 -and $rootMatches -and $log -match 'test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;'
                @{ label = $root.label; exit = $code; process_watchdog_expired = $timedOut;
                  root_matches = $rootMatches; passed = $passed; original_operation_seconds = 2;
                  original_workload_seconds = 240; stdout_then_stderr_is_not_temporal_order = $true
                } | ConvertTo-Json | Set-Content "storage-evidence/$($root.label).result.json"
                if (!$passed) { $failed = $true }
                if ((Get-FileHash -LiteralPath $binary.path -Algorithm SHA256).Hash -ne $binary.sha256) { throw 'Executable changed between controls' }
              } finally {
                if ($owned -and @(Get-ChildItem -LiteralPath $root.path -Force).Count -eq 0) {
                  Remove-Item -LiteralPath $root.path
                }
              }
            }
          } finally { $env:TMP = $originalTmp; $env:TEMP = $originalTemp }
          if ($failed) { throw 'A registered root failed; preserve both results' }
      - name: Checksum compact evidence
        if: always()
        run: |
          if (Test-Path storage-evidence) {
            Get-ChildItem storage-evidence -File | Sort-Object Name | ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
            } | Set-Content storage-evidence/SHA256SUMS
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flowmux-windows-storage-layout-${{ github.run_attempt }}
          path: storage-evidence/
          retention-days: 14
