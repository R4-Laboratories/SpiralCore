name: SpiralCore verified warm-object WAN recheck
on:
  push:
    branches: [codex/spiralcore-warm-object-recheck]
permissions:
  contents: read
concurrency:
  group: spiralcore-warm-object
  cancel-in-progress: false
jobs:
  measure:
    if: github.ref == 'refs/heads/codex/spiralcore-warm-object-recheck' && github.sha == vars.SPIRALCORE_WARM_SOURCE && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: 0
      SPIRALCORE_WARM_SOURCE: ${{ vars.SPIRALCORE_WARM_SOURCE }}
      SPIRALCORE_WARM_RUN: ${{ vars.SPIRALCORE_WARM_RUN }}
      WARM_RECEIVER_SHA: ${{ vars.SPIRALCORE_WARM_RECEIVER_SHA256 }}
      WARM_URL_0: ${{ vars.SPIRALCORE_WARM_URL_0 }}
      WARM_URL_1: ${{ vars.SPIRALCORE_WARM_URL_1 }}
      WARM_URL_2: ${{ vars.SPIRALCORE_WARM_URL_2 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate source and bounded receiver configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir warm-object
          # BEGIN CONFIG GATE
          [[ "$GITHUB_REF" == refs/heads/codex/spiralcore-warm-object-recheck ]] || exit 1
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || exit 1
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$SPIRALCORE_WARM_SOURCE" ]] || exit 1
          [[ "$SPIRALCORE_WARM_RUN" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$WARM_RECEIVER_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          for key in WARM_URL_0 WARM_URL_1 WARM_URL_2; do
            url="${!key}"
            [[ "$url" =~ ^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.trycloudflare\.com/?$ ]] || exit 1
          done
          # END CONFIG GATE
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ ! -e "$CARGO_TARGET_DIR" ]] || exit 1
          [[ -z "${RUSTFLAGS:-}${CARGO_ENCODED_RUSTFLAGS:-}${RUSTC_WRAPPER:-}${RUSTC_WORKSPACE_WRAPPER:-}${CARGO_BUILD_TARGET:-}" ]] || exit 1
          git diff --exit-code > warm-object/source-clean-before.log
          git rev-parse HEAD > warm-object/source-revision.txt
          jq -n --arg source "$GITHUB_SHA" --arg run "$SPIRALCORE_WARM_RUN" \
            --arg receiver "$WARM_RECEIVER_SHA" --arg workflow_run "$GITHUB_RUN_ID" \
            --arg url0 "$WARM_URL_0" --arg url1 "$WARM_URL_1" --arg url2 "$WARM_URL_2" \
            '{schema:"spiralcore.warm-object.workflow.v1",source:$source,run:$run,
              receiver_executable_sha256_operator_supplied:$receiver,
              urls:[$url0,$url1,$url2],github_run_id:$workflow_run,github_run_attempt:1,
              shards:3,trials_per_size:30,sessions:120,targets:120,seeds:120,total_transfers:240,
              byte_scope:"request and response HTTP bodies; not full-path packet bytes"}' \
            > warm-object/registration.json
      - name: Install compiler and record the Linux sender
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy 2>&1 | tee warm-object/toolchain-install.log
          rustc +1.97.1 -vV > warm-object/rustc.txt
          [[ "$(sed -n 's/^host: //p' warm-object/rustc.txt)" == x86_64-unknown-linux-gnu ]] || exit 1
          uname -a > warm-object/platform.txt
          lscpu -J > warm-object/cpu.json
          cargo +1.97.1 tree --locked --manifest-path crates/spiralcore-transfer/Cargo.toml -e features > warm-object/features.txt
          git ls-files -z -- crates/spiralcore-transfer crates/uor-r4-object-store/src \
            .github/workflows/spiralcore-warm-object.yml \
            | sort -z | xargs -0 sha256sum > warm-object/source-files.sha256
      - name: Qualify and freeze one sender for both arms
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 test --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --all-targets 2>&1 | tee warm-object/candidate-tests.log
          cargo +1.97.1 clippy --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --all-targets -- -D warnings 2>&1 | tee warm-object/clippy.log
          cargo +1.97.1 build --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --example schema_fitting 2>&1 | tee warm-object/candidate-build.log
          mkdir warm-object/frozen
          cp "$CARGO_TARGET_DIR/release/examples/schema_fitting" warm-object/frozen/candidate
          sha256sum -c warm-object/source-files.sha256 > warm-object/source-after-build.log
          git diff --exit-code > warm-object/source-clean-after.log
          sha256sum warm-object/frozen/candidate > warm-object/binaries.sha256
          printf '%s\n' 'Both arms use one source revision and executable: forced Sparse and prepared Whole zstd/Raw. Every namespace receives an identical paid Raw base seed; target is absent; optional DAG warming is disabled for both. Whole uses level3/window25/LDM/single-thread/checksum/content-size. Release/default features; Rust1.97.1; incremental disabled; no instrumentation.' > warm-object/build-profile.txt
      - name: Generate the three registered shard plans
        shell: bash
        run: |
          set -euo pipefail
          for shard in 0 1 2; do
            warm-object/frozen/candidate warm-plan "$SPIRALCORE_WARM_RUN" "$shard" "warm-object/plan-$shard.json"
          done
          sha256sum warm-object/plan-*.json > warm-object/plans.sha256
      - name: Run all paired sessions sequentially without retries
        timeout-minutes: 20
        env:
          SPIRALCORE_WAN_TOKEN: ${{ secrets.SPIRALCORE_WARM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # BEGIN AUTH GATE
          [[ "${SPIRALCORE_WAN_TOKEN:-}" =~ ^[0-9a-f]{64}$ ]] || exit 1
          # END AUTH GATE
          sha256sum -c warm-object/binaries.sha256 > warm-object/binaries-before-transfer.log
          for shard in 0 1 2; do
            key="WARM_URL_$shard"
            date -u +%FT%TZ > "warm-object/start-$shard.txt"
            warm-object/frozen/candidate warm-paired "warm-object/plan-$shard.json" \
              warm-object/frozen/candidate "${!key}" \
              "$WARM_RECEIVER_SHA" "warm-object/observations-$shard.jsonl" \
              2>&1 | tee "warm-object/remote-$shard.log"
            date -u +%FT%TZ > "warm-object/end-$shard.txt"
          done
          sha256sum -c warm-object/binaries.sha256 > warm-object/binaries-after-transfer.log
          printf '%s\n' 'Sender complete. Stop receivers and regenerate/reopen every object before asserting exact-byte WAN success.' > warm-object/receiver-verification-pending.txt
      - name: Seal all available evidence including failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p warm-object
          find warm-object -type f ! -name artifact-sha256.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > warm-object/artifact-sha256.txt
      - name: Retain results and the frozen sender executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spiralcore-warm-object-${{ github.run_id }}-${{ github.sha }}
          path: warm-object/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
