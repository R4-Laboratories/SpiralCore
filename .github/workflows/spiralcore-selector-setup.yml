name: SpiralCore selector setup and fallback WAN
on:
  push:
    branches: [codex/spiralcore-selector-setup]
permissions:
  contents: read
concurrency:
  group: spiralcore-selector-setup
  cancel-in-progress: false
jobs:
  measure:
    if: github.ref == 'refs/heads/codex/spiralcore-selector-setup' && github.sha == vars.SPIRALCORE_SETUP_SOURCE && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: 0
      SPIRALCORE_SETUP_SOURCE: ${{ vars.SPIRALCORE_SETUP_SOURCE }}
      SPIRALCORE_SETUP_RUN: ${{ vars.SPIRALCORE_SETUP_RUN }}
      SETUP_RECEIVER_SHA: ${{ vars.SPIRALCORE_SETUP_RECEIVER_SHA256 }}
      SETUP_URL_0: ${{ vars.SPIRALCORE_SETUP_URL_0 }}
      SETUP_URL_1: ${{ vars.SPIRALCORE_SETUP_URL_1 }}
      SETUP_URL_2: ${{ vars.SPIRALCORE_SETUP_URL_2 }}
      SETUP_URL_3: ${{ vars.SPIRALCORE_SETUP_URL_3 }}
      SETUP_URL_4: ${{ vars.SPIRALCORE_SETUP_URL_4 }}
      SETUP_URL_5: ${{ vars.SPIRALCORE_SETUP_URL_5 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate source and bounded receiver configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir selector-setup
          # BEGIN CONFIG GATE
          [[ "$GITHUB_REF" == refs/heads/codex/spiralcore-selector-setup ]] || exit 1
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || exit 1
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$SPIRALCORE_SETUP_SOURCE" ]] || exit 1
          [[ "$SPIRALCORE_SETUP_RUN" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$SETUP_RECEIVER_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          for key in SETUP_URL_0 SETUP_URL_1 SETUP_URL_2 SETUP_URL_3 SETUP_URL_4 SETUP_URL_5; do
            url="${!key}"
            [[ "$url" =~ ^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.trycloudflare\.com/?$ ]] || exit 1
          done
          # END CONFIG GATE
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ ! -e "$CARGO_TARGET_DIR" ]] || exit 1
          [[ -z "${RUSTFLAGS:-}${CARGO_ENCODED_RUSTFLAGS:-}${RUSTC_WRAPPER:-}${RUSTC_WORKSPACE_WRAPPER:-}${CARGO_BUILD_TARGET:-}" ]] || exit 1
          git diff --exit-code > selector-setup/source-clean-before.log
          git rev-parse HEAD > selector-setup/source-revision.txt
          jq -n --arg source "$GITHUB_SHA" --arg run "$SPIRALCORE_SETUP_RUN" \
            --arg receiver "$SETUP_RECEIVER_SHA" --arg workflow_run "$GITHUB_RUN_ID" \
            --arg url0 "$SETUP_URL_0" --arg url1 "$SETUP_URL_1" --arg url2 "$SETUP_URL_2" \
            --arg url3 "$SETUP_URL_3" --arg url4 "$SETUP_URL_4" --arg url5 "$SETUP_URL_5" \
            '{schema:"spiralcore.selector-setup.workflow.v1",source:$source,run:$run,
              receiver_executable_sha256_operator_supplied:$receiver,
              urls:[$url0,$url1,$url2,$url3,$url4,$url5],github_run_id:$workflow_run,github_run_attempt:1,
              shards:6,trials_per_case:30,cases:["random-1m","zero-1m","random-16m"],sessions:270,targets:270,seeds:270,total_transfers:540,
              byte_scope:"request and response HTTP bodies; not full-path packet bytes"}' \
            > selector-setup/registration.json
      - name: Install compiler and record the Linux sender
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy 2>&1 | tee selector-setup/toolchain-install.log
          rustc +1.97.1 -vV > selector-setup/rustc.txt
          [[ "$(sed -n 's/^host: //p' selector-setup/rustc.txt)" == x86_64-unknown-linux-gnu ]] || exit 1
          uname -a > selector-setup/platform.txt
          lscpu -J > selector-setup/cpu.json
          cargo +1.97.1 tree --locked --manifest-path crates/spiralcore-transfer/Cargo.toml -e features > selector-setup/features.txt
          git ls-files -z -- crates/spiralcore-transfer crates/uor-r4-object-store/src \
            .github/workflows/spiralcore-selector-setup.yml \
            | sort -z | xargs -0 sha256sum > selector-setup/source-files.sha256
      - name: Qualify candidate and freeze matched baseline and candidate senders
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          SPIRALCORE_EXPECT_ZSTD_PROBE=enabled cargo +1.97.1 test --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --all-targets 2>&1 | tee selector-setup/candidate-tests.log
          cargo +1.97.1 clippy --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --all-targets -- -D warnings 2>&1 | tee selector-setup/clippy.log
          cargo +1.97.1 build --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --example schema_fitting 2>&1 | tee selector-setup/candidate-build.log
          mkdir selector-setup/frozen
          cp "$CARGO_TARGET_DIR/release/examples/schema_fitting" selector-setup/frozen/candidate
          warm_id=crates/spiralcore-transfer
          baseline=4bb79f976e0939f3ef8b48c3830b07086b98f280
          printf '%s\n' "$baseline" > selector-setup/baseline-production-revision.txt
          for file in src/schema.rs src/schema_selection.rs; do
            git show "$baseline:$warm_id/$file" > "$warm_id/$file"
          done
          sha256sum "$warm_id/src/schema.rs" "$warm_id/src/schema_selection.rs" > selector-setup/baseline-overlay.sha256
          cargo +1.97.1 build --release --locked --manifest-path "$warm_id/Cargo.toml" --example schema_fitting 2>&1 | tee selector-setup/baseline-build.log
          cp "$CARGO_TARGET_DIR/release/examples/schema_fitting" selector-setup/frozen/baseline
          for file in src/schema.rs src/schema_selection.rs; do
            git show "$GITHUB_SHA:$warm_id/$file" > "$warm_id/$file"
          done
          selector-setup/frozen/candidate setup-identity > selector-setup/candidate-identity.json
          selector-setup/frozen/baseline setup-identity > selector-setup/baseline-identity.json
          jq -e '.first_block_probe_available == true' selector-setup/candidate-identity.json > selector-setup/candidate-probe-enabled.txt
          jq -e '.first_block_probe_available == true' selector-setup/baseline-identity.json > selector-setup/baseline-probe-enabled.txt
          sha256sum -c selector-setup/source-files.sha256 > selector-setup/source-after-build.log
          git diff --exit-code > selector-setup/source-clean-after.log
          sha256sum selector-setup/frozen/baseline selector-setup/frozen/candidate > selector-setup/binaries.sha256
          printf '%s\n' 'Common current harness; baseline overlays exactly two production files from4bb79f9 with probe enabled, candidate uses exact duplicate-layout fitting and short-period probe scheduling, Whole control uses candidate unchanged full encoder. All arms pay fit/context and actual Raw seed. Same Rust1.97.1 release/default features; no instrumentation.' > selector-setup/build-profile.txt
      - name: Generate the six registered shard plans
        shell: bash
        run: |
          set -euo pipefail
          for shard in 0 1 2 3 4 5; do
            selector-setup/frozen/candidate setup-plan "$SPIRALCORE_SETUP_RUN" "$shard" "selector-setup/plan-$shard.json"
          done
          sha256sum selector-setup/plan-*.json > selector-setup/plans.sha256
      - name: Run all paired sessions sequentially without retries
        timeout-minutes: 20
        env:
          SPIRALCORE_WAN_TOKEN: ${{ secrets.SPIRALCORE_SETUP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # BEGIN AUTH GATE
          [[ "${SPIRALCORE_WAN_TOKEN:-}" =~ ^[0-9a-f]{64}$ ]] || exit 1
          # END AUTH GATE
          sha256sum -c selector-setup/binaries.sha256 > selector-setup/binaries-before-transfer.log
          for shard in 0 1 2 3 4 5; do
            key="SETUP_URL_$shard"
            date -u +%FT%TZ > "selector-setup/start-$shard.txt"
            selector-setup/frozen/candidate setup-paired "selector-setup/plan-$shard.json" selector-setup/frozen/baseline \
              selector-setup/frozen/candidate "${!key}" \
              "$SETUP_RECEIVER_SHA" "selector-setup/observations-$shard.jsonl" \
              2>&1 | tee "selector-setup/remote-$shard.log"
            date -u +%FT%TZ > "selector-setup/end-$shard.txt"
          done
          sha256sum -c selector-setup/binaries.sha256 > selector-setup/binaries-after-transfer.log
          printf '%s\n' 'Sender complete. Stop receivers and regenerate/reopen every object before asserting exact-byte WAN success.' > selector-setup/receiver-verification-pending.txt
      - name: Seal all available evidence including failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p selector-setup
          find selector-setup -type f ! -name artifact-sha256.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > selector-setup/artifact-sha256.txt
      - name: Retain results and the frozen sender executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spiralcore-selector-setup-${{ github.run_id }}-${{ github.sha }}
          path: selector-setup/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
