name: SpiralCore warm-selection codec selection WAN
on:
  push:
    branches: [codex/spiralcore-warm-selection]
permissions:
  contents: read
concurrency:
  group: spiralcore-warm-selection
  cancel-in-progress: false
jobs:
  measure:
    if: github.ref == 'refs/heads/codex/spiralcore-warm-selection' && github.sha == vars.SPIRALCORE_WARMSELECT_SOURCE && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: 0
      SPIRALCORE_WARMSELECT_SOURCE: ${{ vars.SPIRALCORE_WARMSELECT_SOURCE }}
      SPIRALCORE_WARMSELECT_RUN: ${{ vars.SPIRALCORE_WARMSELECT_RUN }}
      WARMSELECT_RECEIVER_SHA: ${{ vars.SPIRALCORE_WARMSELECT_RECEIVER_SHA256 }}
      WARMSELECT_URL_0: ${{ vars.SPIRALCORE_WARMSELECT_URL_0 }}
      WARMSELECT_URL_1: ${{ vars.SPIRALCORE_WARMSELECT_URL_1 }}
      WARMSELECT_URL_2: ${{ vars.SPIRALCORE_WARMSELECT_URL_2 }}
      WARMSELECT_URL_3: ${{ vars.SPIRALCORE_WARMSELECT_URL_3 }}
      WARMSELECT_URL_4: ${{ vars.SPIRALCORE_WARMSELECT_URL_4 }}
      WARMSELECT_URL_5: ${{ vars.SPIRALCORE_WARMSELECT_URL_5 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate source and bounded receiver configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir warm-selection
          # BEGIN CONFIG GATE
          [[ "$GITHUB_REF" == refs/heads/codex/spiralcore-warm-selection ]] || exit 1
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || exit 1
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$SPIRALCORE_WARMSELECT_SOURCE" ]] || exit 1
          [[ "$SPIRALCORE_WARMSELECT_RUN" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$WARMSELECT_RECEIVER_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          for key in WARMSELECT_URL_0 WARMSELECT_URL_1 WARMSELECT_URL_2 WARMSELECT_URL_3 WARMSELECT_URL_4 WARMSELECT_URL_5; do
            url="${!key}"
            [[ "$url" =~ ^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.trycloudflare\.com/?$ ]] || exit 1
          done
          # END CONFIG GATE
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ ! -e "$CARGO_TARGET_DIR" ]] || exit 1
          [[ -z "${RUSTFLAGS:-}${CARGO_ENCODED_RUSTFLAGS:-}${RUSTC_WRAPPER:-}${RUSTC_WORKSPACE_WRAPPER:-}${CARGO_BUILD_TARGET:-}" ]] || exit 1
          git diff --exit-code > warm-selection/source-clean-before.log
          git rev-parse HEAD > warm-selection/source-revision.txt
          jq -n --arg source "$GITHUB_SHA" --arg run "$SPIRALCORE_WARMSELECT_RUN" \
            --arg receiver "$WARMSELECT_RECEIVER_SHA" --arg workflow_run "$GITHUB_RUN_ID" \
            --arg url0 "$WARMSELECT_URL_0" --arg url1 "$WARMSELECT_URL_1" --arg url2 "$WARMSELECT_URL_2" \
            --arg url3 "$WARMSELECT_URL_3" --arg url4 "$WARMSELECT_URL_4" --arg url5 "$WARMSELECT_URL_5" \
            '{schema:"spiralcore.warm-selection.workflow.v1",source:$source,run:$run,
              receiver_executable_sha256_operator_supplied:$receiver,
              urls:[$url0,$url1,$url2,$url3,$url4,$url5],github_run_id:$workflow_run,github_run_attempt:1,
              shards:6,trials_per_size:30,sessions:180,targets:180,seeds:180,total_transfers:360,
              byte_scope:"request and response HTTP bodies; not full-path packet bytes"}' \
            > warm-selection/registration.json
      - name: Install compiler and record the Linux sender
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy 2>&1 | tee warm-selection/toolchain-install.log
          rustc +1.97.1 -vV > warm-selection/rustc.txt
          [[ "$(sed -n 's/^host: //p' warm-selection/rustc.txt)" == x86_64-unknown-linux-gnu ]] || exit 1
          uname -a > warm-selection/platform.txt
          lscpu -J > warm-selection/cpu.json
          cargo +1.97.1 tree --locked --manifest-path crates/spiralcore-transfer/Cargo.toml -e features > warm-selection/features.txt
          git ls-files -z -- crates/spiralcore-transfer crates/uor-r4-object-store/src \
            .github/workflows/spiralcore-warm-selection.yml \
            | sort -z | xargs -0 sha256sum > warm-selection/source-files.sha256
      - name: Qualify and freeze one sender for all three arms
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 test --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --all-targets 2>&1 | tee warm-selection/candidate-tests.log
          cargo +1.97.1 clippy --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --all-targets -- -D warnings 2>&1 | tee warm-selection/clippy.log
          cargo +1.97.1 build --release --locked --manifest-path crates/spiralcore-transfer/Cargo.toml --example schema_fitting 2>&1 | tee warm-selection/candidate-build.log
          mkdir warm-selection/frozen
          cp "$CARGO_TARGET_DIR/release/examples/schema_fitting" warm-selection/frozen/candidate
          sha256sum -c warm-selection/source-files.sha256 > warm-selection/source-after-build.log
          git diff --exit-code > warm-selection/source-clean-after.log
          sha256sum warm-selection/frozen/candidate > warm-selection/binaries.sha256
          printf '%s\n' 'Three arms use one source revision and executable: warm selector, forced Sparse and prepared Whole zstd/Raw. Selector fit and contexts are paid once per actual session. Every namespace receives an identical paid Raw base seed; target is absent; optional DAG warming is disabled for both. Whole uses level3/window25/LDM/single-thread/checksum/content-size. Release/default features; Rust1.97.1; incremental disabled; no instrumentation.' > warm-selection/build-profile.txt
      - name: Generate the six registered shard plans
        shell: bash
        run: |
          set -euo pipefail
          for shard in 0 1 2 3 4 5; do
            warm-selection/frozen/candidate warmselect-plan "$SPIRALCORE_WARMSELECT_RUN" "$shard" "warm-selection/plan-$shard.json"
          done
          sha256sum warm-selection/plan-*.json > warm-selection/plans.sha256
      - name: Run all paired sessions sequentially without retries
        timeout-minutes: 20
        env:
          SPIRALCORE_WAN_TOKEN: ${{ secrets.SPIRALCORE_WARMSELECT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # BEGIN AUTH GATE
          [[ "${SPIRALCORE_WAN_TOKEN:-}" =~ ^[0-9a-f]{64}$ ]] || exit 1
          # END AUTH GATE
          sha256sum -c warm-selection/binaries.sha256 > warm-selection/binaries-before-transfer.log
          for shard in 0 1 2 3 4 5; do
            key="WARMSELECT_URL_$shard"
            date -u +%FT%TZ > "warm-selection/start-$shard.txt"
            warm-selection/frozen/candidate warmselect-paired "warm-selection/plan-$shard.json" \
              warm-selection/frozen/candidate "${!key}" \
              "$WARMSELECT_RECEIVER_SHA" "warm-selection/observations-$shard.jsonl" \
              2>&1 | tee "warm-selection/remote-$shard.log"
            date -u +%FT%TZ > "warm-selection/end-$shard.txt"
          done
          sha256sum -c warm-selection/binaries.sha256 > warm-selection/binaries-after-transfer.log
          printf '%s\n' 'Sender complete. Stop receivers and regenerate/reopen every object before asserting exact-byte WAN success.' > warm-selection/receiver-verification-pending.txt
      - name: Seal all available evidence including failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p warm-selection
          find warm-selection -type f ! -name artifact-sha256.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > warm-selection/artifact-sha256.txt
      - name: Retain results and the frozen sender executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spiralcore-warm-selection-${{ github.run_id }}-${{ github.sha }}
          path: warm-selection/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
