[package]
name = "spiralcore-transfer"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Experimental exact object transfer at an authenticated mailbox boundary"

[features]
# Opt-in backend; initial qualification scope: native aarch64-apple-darwin.
# sha2-asm does not support Windows. This is not a FIPS validation claim.
hardware-sha256 = ["sha2/asm"]

[dependencies]
sha2 = "0.10.9"
zstd = "0.13"
# Direct dependency supplies bundled source metadata to the proof guard.
zstd-sys = { version = "=2.1.2", default-features = false, features = ["vendored"] }
uor-r4-object-store = { path = "../uor-r4-object-store" }
cpu-time = "1.0"
httparse = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memchr = "=2.8.3"
subtle = "2.6"
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2.5"

[dev-dependencies]

[build-dependencies]
sha2 = "0.10.9"
