[package]
name = "spiralcore-installed-owner-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("canonical-host"))'] }

[dependencies]
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
mvm-core = { git = "https://github.com/Casey-allard/mvm", rev = "468661f47e01d0f59c6f1da4e35a968ceccb3ad2", default-features = false, features = ["test-support"] }

[profile.release]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
