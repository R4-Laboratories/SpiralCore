[package]
name = "installed-supervisor-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
[workspace]
[features]
default = ["linux-host"]
linux-host = []
[lib]
doctest = false
[[bin]]
name = "installed-native-death"
path = "src/native_death.rs"
[dependencies]
libc = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
[profile.test]
debug = 0
incremental = false
[profile.release]
debug = 0
incremental = false
