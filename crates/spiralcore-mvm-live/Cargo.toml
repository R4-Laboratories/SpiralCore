[package]
name = "spiralcore-mvm-live"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Bounded native HVF guest/vsock integration witness for SpiralCore"

[features]
default = ["live"]
live = []
linux-host = ["dep:mvm-backends", "dep:mvm-vmm", "dep:mvm-net", "dep:mvm-build", "dep:mvm-fs"]
canonical-host = ["dep:anyhow", "dep:mvm-hostd", "dep:mvm-client"]

[dependencies]
anyhow = { version = "1", optional = true }
spiralcore-gateway-core = { path = "../spiralcore-gateway-core", features = ["hardware-sha256"] }
spiralcore-mvm-adapter = { path = "../spiralcore-mvm-adapter", features = ["live", "hardware-sha256"] }
spiralcore-transfer = { path = "../spiralcore-transfer", features = ["hardware-sha256"] }
mvm-core = { git = "https://github.com/Casey-allard/mvm", rev = "7d031c7f3fbeef62826712d2976a764c62cd5852", default-features = false }
mvm-contract = { git = "https://github.com/Casey-allard/mvm", rev = "7d031c7f3fbeef62826712d2976a764c62cd5852", default-features = false, features = ["protocol"] }
mvm-hostd = { git = "https://github.com/Casey-allard/mvm", rev = "7d031c7f3fbeef62826712d2976a764c62cd5852", default-features = false, optional = true }
mvm-client = { git = "https://github.com/Casey-allard/mvm", rev = "7d031c7f3fbeef62826712d2976a764c62cd5852", default-features = false, optional = true }
ed25519-dalek = "3"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
cpu-time = "1"
libc = "0.2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mvm-vmm = { git = "https://github.com/Casey-allard/mvm", rev = "7d031c7f3fbeef62826712d2976a764c62cd5852", default-features = false }
mvm-runtime = { git = "https://github.com/Casey-allard/mvm", rev = "7d031c7f3fbeef62826712d2976a764c62cd5852", default-features = false }
mvm-build = { git = "https://github.com/Casey-allard/mvm", rev = "7d031c7f3fbeef62826712d2976a764c62cd5852", default-features = false }
mvm-fs = { git = "https://github.com/Casey-allard/mvm", rev = "7d031c7f3fbeef62826712d2976a764c62cd5852", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
mvm-agentd = { git = "https://github.com/Casey-allard/mvm", rev = "7d031c7f3fbeef62826712d2976a764c62cd5852", default-features = false }
mvm-backends = { git = "https://github.com/Casey-allard/mvm", rev = "7d031c7f3fbeef62826712d2976a764c62cd5852", default-features = false, optional = true }
mvm-vmm = { git = "https://github.com/Casey-allard/mvm", rev = "7d031c7f3fbeef62826712d2976a764c62cd5852", default-features = false, optional = true }
mvm-net = { git = "https://github.com/Casey-allard/mvm", rev = "7d031c7f3fbeef62826712d2976a764c62cd5852", default-features = false, optional = true }
mvm-build = { git = "https://github.com/Casey-allard/mvm", rev = "7d031c7f3fbeef62826712d2976a764c62cd5852", default-features = false, optional = true }
mvm-fs = { git = "https://github.com/Casey-allard/mvm", rev = "7d031c7f3fbeef62826712d2976a764c62cd5852", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "adapter_live"
path = "../spiralcore-mvm-adapter/tests/live.rs"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
