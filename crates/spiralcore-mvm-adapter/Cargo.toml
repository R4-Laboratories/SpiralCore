[package]
name = "spiralcore-mvm-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Experimental SpiralCore adapter to pinned canonical MVM mailbox envelopes"

[features]
default = []
conformance = []
live = []
hardware-sha256 = ["spiralcore-transfer/hardware-sha256"]

[dependencies]
spiralcore-transfer = { git = "https://github.com/R4-Laboratories/SpiralCore", rev = "ca5d9ca1266541f71cc5ab7d0b17f4acf14d06b1" }
mvm-core = { git = "https://github.com/Casey-allard/mvm", rev = "8b833aee8be5c1be9ce0d1197b6b98d4d03625f6", default-features = false }
mvm-contract = { git = "https://github.com/Casey-allard/mvm", rev = "8b833aee8be5c1be9ce0d1197b6b98d4d03625f6", default-features = false, features = ["protocol"] }
ed25519-dalek = "3"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
cpu-time = "1"
sha2 = "0.10.9"

[dev-dependencies]
libc = "0.2"

[[example]]
name = "service_capacity"
required-features = ["live"]

[[example]]
name = "service_sustained"
required-features = ["live"]

[[example]]
name = "mailbox_transfer"
required-features = ["conformance"]

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
