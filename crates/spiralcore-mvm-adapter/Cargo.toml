[package]
name = "spiralcore-mvm-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Experimental SpiralCore adapter to pinned canonical MVM mailbox envelopes"

[features]
default = []
conformance = []
live = []
hardware-sha256 = ["spiralcore-transfer/hardware-sha256"]

[dependencies]
spiralcore-transfer = { path = "../spiralcore-transfer" }
mvm-core = { git = "https://github.com/Casey-allard/mvm", rev = "c07d912e79cb1623bd26516fb6a48eddb640e01b", default-features = false }
mvm-contract = { git = "https://github.com/Casey-allard/mvm", rev = "c07d912e79cb1623bd26516fb6a48eddb640e01b", default-features = false, features = ["protocol"] }
ed25519-dalek = "3"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
cpu-time = "1"
sha2 = "0.10.9"

[dev-dependencies]
libc = "0.2"

[[example]]
name = "service_capacity"
required-features = ["live"]

[[example]]
name = "service_sustained"
required-features = ["live"]

[[example]]
name = "mailbox_transfer"
required-features = ["conformance"]

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Cargo reads optimization profiles from the invoking package. Preserve MVM's
# dev/test settings for the crypto used by signed operations and their deadlines.
[profile.dev.package.mvm-core]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.ring]
opt-level = 3
[profile.dev.package.zeroize]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
