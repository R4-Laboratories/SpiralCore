[package]
name = "spiralcore-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
spiralcore-gateway-core = { path = "../spiralcore-gateway-core" }
spiralcore-transfer = { path = "../spiralcore-transfer" }
tokio-util = { version = "=0.7.11", features = ["rt"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "signal"] }
bytes = "=1.12.1"
sha2 = "0.10.9"
libc = "=0.2.191"
thiserror = "=2.0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
tempfile = "3"
