[package]
name = "spiralcore-mvm-journal-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace]

[dependencies]
spiralcore-mvm-adapter = { path = "../spiralcore-mvm-adapter", features = ["live"] }
mvm-core = { git = "https://github.com/Casey-allard/mvm", rev = "7b22454077530e96146d68204b711de53e3d05a8", default-features = false }
mvm-contract = { git = "https://github.com/Casey-allard/mvm", rev = "7b22454077530e96146d68204b711de53e3d05a8", default-features = false, features = ["protocol"] }
journal-core = { package = "mvm-core", git = "https://github.com/tinylabscom/mvm", rev = "543efc7f94aa756c09785b38bdd024b6ba8199c7", default-features = false }
journal-contract = { package = "mvm-contract", git = "https://github.com/tinylabscom/mvm", rev = "543efc7f94aa756c09785b38bdd024b6ba8199c7", default-features = false, features = ["protocol"] }
mvm-agentd = { git = "https://github.com/tinylabscom/mvm", rev = "543efc7f94aa756c09785b38bdd024b6ba8199c7", default-features = false }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
spiralcore-transfer = { path = "../spiralcore-transfer" }
mvm-hostd = { git = "https://github.com/tinylabscom/mvm", rev = "543efc7f94aa756c09785b38bdd024b6ba8199c7" }
tempfile = "3"
ed25519-dalek = "3"
rand = "0.10"
cpu-time = "1"
sha2 = "0.10"

[profile.dev]
debug = 0
incremental = false

# Cargo reads optimization profiles from the invoking package. Preserve MVM's
# dev/test settings for the crypto used by signed operations and their deadlines.
[profile.dev.package.mvm-core]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.ring]
opt-level = 3
[profile.dev.package.zeroize]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
