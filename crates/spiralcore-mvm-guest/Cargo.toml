[package]
name = "spiralcore-mvm-guest"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
description = "SpiralCore frame binding for MVM's trusted-host local durable guest mailbox"

[dependencies]
mvm-agentd = { git = "https://github.com/tinylabscom/mvm", rev = "48fa5b488c4543f0f7988df722633554663a9764", default-features = false }
mvm-contract = { git = "https://github.com/tinylabscom/mvm", rev = "48fa5b488c4543f0f7988df722633554663a9764", default-features = false, features = ["protocol"] }
mvm-core = { git = "https://github.com/tinylabscom/mvm", rev = "48fa5b488c4543f0f7988df722633554663a9764", default-features = false }
spiralcore-transfer = { path = "../spiralcore-transfer" }
thiserror = "2"
rustix = { version = "1.1", features = ["net", "event"] }

cpu-time = "1"
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "3"
